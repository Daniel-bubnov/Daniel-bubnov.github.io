async function renderPlan() {
  setHeader('План', `<button class="btn sm" id="go-today">Сегодня</button>`);
  $('#go-today').onclick = () => {
    const d = new Date();
    state.month = new Date(d.getFullYear(), d.getMonth(), 1);
    state.selDate = today();
    renderPlan();
  };
  const v = $('#view');
  if (!$('.cal', v)) v.innerHTML = spinner();
  const y = state.month.getFullYear(), mo = state.month.getMonth();
  const from = ymd(new Date(y, mo, 1)), to = ymd(new Date(y, mo + 1, 0));
  const wStart = mondayOf(today()), wEnd = addDays(wStart, 6);
  const [monthR, weekR, doneR, upR] = await Promise.all([
    sb.from('workouts').select('id, date, title, completed, workout_exercises(count)').gte('date', from).lte('date', to).order('created_at'),
    sb.from('workouts').select('id, completed, workout_exercises(sets(actual_reps, actual_weight, done))').gte('date', wStart).lte('date', wEnd),
    sb.from('workouts').select('date').eq('completed', true).gte('date', addDays(wStart, -7 * 104)),
    sb.from('workouts').select('id, date, title, completed, workout_exercises(count)').gte('date', today()).eq('completed', false).order('date').limit(5),
  ]);
  const err = monthR.error || weekR.error || doneR.error || upR.error;
  if (err) return fail(err);
  if (state.tab !== 'plan' || state.workoutId) return;
  let volume = 0;
  for (const w of weekR.data) for (const we of w.workout_exercises || []) for (const s of we.sets || [])
    if (s.done) volume += (s.actual_reps || 0) * (Number(s.actual_weight) || 0);
  const weeks = new Set(doneR.data.map(r => mondayOf(r.date)));
  let cur = weeks.has(wStart) ? wStart : addDays(wStart, -7), streak = 0;
  while (weeks.has(cur)) { streak++; cur = addDays(cur, -7); }
  state.monthWorkouts = monthR.data;
  state.planCache = {
    week: { total: weekR.data.length, done: weekR.data.filter(w => w.completed).length, volume, start: wStart, end: wEnd },
    streak, upcoming: upR.data,
  };
  drawPlan();
}

function workoutItem(w, showDate) {
  const c = w.workout_exercises?.[0]?.count || 0;
  const sub = `${showDate ? `${fmtDate(w.date)}, ` : ''}${c ? `${c} ${plural(c, ['упражнение', 'упражнения', 'упражнений'])}` : 'пока без упражнений'}`;
  return `<button class="w-item" data-w="${w.id}">
    <span class="w-dot ${w.completed ? 'ok' : ''}"></span>
    <span class="grow"><span class="w-title">${esc(w.title || 'Тренировка')}</span><span class="w-sub">${esc(sub)}</span></span>
    ${w.completed ? '<span class="pill ok">выполнена</span>' : ''}${ic('chev', 'chev')}
  </button>`;
}

function drawPlan() {
  const { week, streak, upcoming } = state.planCache;
  const v = $('#view');
  const y = state.month.getFullYear(), mo = state.month.getMonth();
  const offset = (new Date(y, mo, 1).getDay() + 6) % 7;
  const days = new Date(y, mo + 1, 0).getDate();
  const byDate = {};
  state.monthWorkouts.forEach(w => (byDate[w.date] ||= []).push(w));
  const t = today();
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad(mo + 1)}-${pad(d)}`;
    const ws = byDate[ds] || [];
    const cls = [ws.length ? (ws.every(w => w.completed) ? 'done' : 'plan') : '', ds === t ? 'today' : '', ds === state.selDate ? 'sel' : ''].join(' ');
    const label = `${d} ${MONTHS_GEN[mo]}${ws.length ? `, ${ws.length} ${plural(ws.length, ['тренировка', 'тренировки', 'тренировок'])}` : ''}`;
    cells += `<button class="day ${cls}" data-date="${ds}" aria-label="${label}" ${ds === state.selDate ? 'aria-pressed="true"' : ''}>${d}${ws.length > 1 ? `<span class="cnt">${ws.length}</span>` : ''}</button>`;
  }
  const ws0 = parseYmd(week.start), we0 = parseYmd(week.end);
  const range = ws0.getMonth() === we0.getMonth()
    ? `${ws0.getDate()}–${we0.getDate()} ${mon3(we0.getMonth())}`
    : `${shortDate(week.start)} – ${shortDate(week.end)}`;
  const dayWs = byDate[state.selDate] || [];
  const up = upcoming.filter(w => w.date !== state.selDate).slice(0, 4);

  v.innerHTML = `
    <section class="card week">
      <div class="week-head"><span class="week-title">Эта неделя</span><span class="hint">${range}</span></div>
      <div class="stats3">
        ${stat(`${week.done}<small> из ${week.total}</small>`, 'тренировок выполнено')}
        ${stat(week.volume ? fmtTonnage(week.volume) : '0', 'поднято за неделю')}
        ${stat(String(streak), plural(streak, ['неделя подряд', 'недели подряд', 'недель подряд']))}
      </div>
    </section>
    <section class="card cal">
      <div class="cal-head">
        <button class="icon-btn" id="m-prev" aria-label="Предыдущий месяц">${ic('back')}</button>
        <div class="cal-title">${MONTHS[mo]} ${y}</div>
        <button class="icon-btn" id="m-next" aria-label="Следующий месяц">${ic('chev')}</button>
      </div>
      <div class="cal-grid">${WD.map(d => `<div class="wd">${d}</div>`).join('')}${cells}</div>
      <div class="legend"><span><i style="background:var(--accent-soft)"></i>в плане</span><span><i style="background:var(--done-soft)"></i>выполнено</span></div>
    </section>
    <div class="section-head"><h2 class="section-title">${esc(dayTitle(state.selDate))}</h2></div>
    <div class="list">${dayWs.map(w => workoutItem(w, false)).join('') || '<p class="day-empty">На этот день ничего не запланировано.</p>'}</div>
    <button class="btn ${dayWs.length ? 'soft' : 'primary'} block lg mt" id="new-w">${ic('plus')}Запланировать тренировку</button>
    ${up.length ? `<div class="section-head"><h2 class="section-title">Ближайшие</h2></div><div class="list">${up.map(w => workoutItem(w, true)).join('')}</div>` : ''}`;

  const shiftMonth = n => {
    state.month = new Date(y, mo + n, 1);
    const tm = new Date();
    state.selDate = (state.month.getFullYear() === tm.getFullYear() && state.month.getMonth() === tm.getMonth()) ? today() : ymd(state.month);
    renderPlan();
  };
  $('#m-prev').onclick = () => shiftMonth(-1);
  $('#m-next').onclick = () => shiftMonth(1);
  $('#new-w').onclick = () => openNewWorkout();
  v.onclick = ev => {
    const d = ev.target.closest('.day');
    if (d) { state.selDate = d.dataset.date; drawPlan(); return; }
    const w = ev.target.closest('[data-w]');
    if (w) { state.workoutId = w.dataset.w; renderView(); window.scrollTo(0, 0); }
  };
}

async function openNewWorkout() {
  const m = openModal(`${sheetHead('Новая тренировка')}
    <form class="form" id="nw-form">
      <label class="field"><span class="label">Название</span><input class="input" name="title" placeholder="Например, ноги и ягодицы" autofocus></label>
      <label class="field"><span class="label">Дата</span><input class="input" type="date" name="date" required value="${state.selDate}"></label>
      <button class="btn primary block lg" type="submit">Создать тренировку</button>
    </form>
    <div id="tpl-box"></div>`);
  $('#nw-form', m.el).onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const { data, error } = await sb.from('workouts').insert({ title: fd.get('title').trim() || null, date: fd.get('date') }).select().single();
    if (error) return fail(error);
    m.close(true);
    goToWorkout(data);
  };
  // прошлые тренировки как шаблоны
  const { data } = await sb.from('workouts').select('id, date, title, workout_exercises(count)').order('date', { ascending: false }).limit(40);
  const box = $('#tpl-box', m.el);
  if (!box || !data) return;
  const seen = new Set(), tpls = [];
  for (const w of data) {
    const c = w.workout_exercises?.[0]?.count || 0;
    if (!c) continue;
    const key = (w.title || '').trim().toLowerCase() || w.id;
    if (seen.has(key)) continue;
    seen.add(key); tpls.push({ ...w, c });
    if (tpls.length >= 6) break;
  }
  if (!tpls.length) return;
  box.innerHTML = `<div class="section-head"><h3 class="section-title">Или повторите прошлую</h3></div>
    <div class="list">${tpls.map(t => `<button class="w-item" data-tpl="${t.id}"><span class="grow"><span class="w-title">${esc(t.title || 'Тренировка')}</span>
      <span class="w-sub">${shortDate(t.date)}, ${t.c} ${plural(t.c, ['упражнение', 'упражнения', 'упражнений'])}</span></span>${ic('copy', 'chev')}</button>`).join('')}</div>
    <p class="hint">Упражнения скопируются, а выполненные вес и повторения станут новым планом.</p>`;
  box.onclick = async e => {
    const b = e.target.closest('[data-tpl]');
    if (!b) return;
    b.disabled = true;
    const date = $('[name=date]', m.el).value || state.selDate;
    try {
      const src = await loadWorkout(b.dataset.tpl);
      if (!src) throw new Error('Тренировка не найдена');
      const nw = await copyWorkout(src, date, $('[name=title]', m.el).value.trim() || src.title);
      m.close(true);
      toast(`Тренировка на ${shortDate(date)} готова`, 'ok');
      goToWorkout(nw);
    } catch (err) { fail(err); b.disabled = false; }
  };
}

function goToWorkout(w) {
  state.selDate = w.date;
  const d = parseYmd(w.date);
  state.month = new Date(d.getFullYear(), d.getMonth(), 1);
  state.workoutId = w.id;
  state.tab = 'plan';
  renderView();
  window.scrollTo(0, 0);
}

// =====================================================================
// Тренировка
// =====================================================================
async function loadWorkout(id) {
  const { data, error } = await sb.from('workouts')
    .select('*, workout_exercises(id, exercise_id, position, notes, sets(*))').eq('id', id).maybeSingle();
  if (error) { fail(error); return null; }
  if (!data) return null;
  data.workout_exercises.sort((a, b) => a.position - b.position);
  data.workout_exercises.forEach(we => we.sets.sort((a, b) => a.set_number - b.set_number));
  return data;
}

async function copyWorkout(src, date, title) {
  const { data: nw, error } = await sb.from('workouts').insert({ date, title: title || null }).select().single();
  if (error) throw error;
  const list = src.workout_exercises;
  if (list.length) {
    const { data: wes, error: e2 } = await sb.from('workout_exercises')
      .insert(list.map((we, i) => ({ workout_id: nw.id, exercise_id: we.exercise_id, position: i, notes: we.notes })))
      .select('id, position');
    if (e2) throw e2;
    const idByPos = Object.fromEntries(wes.map(x => [x.position, x.id]));
    const sets = list.flatMap((we, i) => we.sets.map(s => ({
      workout_exercise_id: idByPos[i], set_number: s.set_number,
      planned_reps: s.done && s.actual_reps != null ? s.actual_reps : s.planned_reps,
      planned_weight: s.done && s.actual_weight != null ? s.actual_weight : s.planned_weight,
    })));
    if (sets.length) { const { error: e3 } = await sb.from('sets').insert(sets); if (e3) throw e3; }
  }
  return nw;
}

async function renderWorkout() {
  setHeader('Тренировка');
  const v = $('#view');
  v.innerHTML = spinner();
  const id = state.workoutId;
  const w = await loadWorkout(id);
  if (!w) { state.workoutId = null; toast('Тренировка не найдена', 'err'); return renderView(); }
  const hist = await loadExerciseHistory([...new Set(w.workout_exercises.map(x => x.exercise_id))], { before: w.date });
  if (state.tab !== 'plan' || state.workoutId !== id) return;
  state.w = w; state.hist = hist;
  drawWorkout();
}

function isPR(we, s) {
  if (!s.done || s.actual_reps == null) return false;
  const h = state.hist[we.exercise_id];
  if (!h) return false;
  if (s.actual_weight != null) return !!h.bestW && Number(s.actual_weight) > h.bestW.w;
  return !!h.bestReps && s.actual_reps > h.bestReps.reps;
}
function workoutStats(w) {
  let total = 0, done = 0, vol = 0, prs = 0;
  for (const we of w.workout_exercises) {
    let pr = false;
    for (const s of we.sets) {
      total++;
      if (!s.done) continue;
      done++;
      vol += (s.actual_reps || 0) * (Number(s.actual_weight) || 0);
      if (isPR(we, s)) pr = true;
    }
    if (pr) prs++;
  }
  return { total, done, vol, prs };
}
const restFor = e => (e && e.rest_seconds) || settings.rest;
const planStr = s => (s.planned_reps == null && s.planned_weight == null) ? '—'
  : s.planned_weight == null ? `${s.planned_reps}` : `${fmtW(s.planned_weight)}×${s.planned_reps ?? '?'}`;

function weInfoHtml(we) {
  const h = state.hist[we.exercise_id];
  const out = [];
  if (we.sets.some(s => isPR(we, s))) out.push(`<span class="info-chip pr">${ic('trophy')}Новый рекорд</span>`);
  if (h?.last) out.push(`<span class="info-chip">Прошлый раз, ${esc(shortDate(h.last.date))}: ${esc(setsSummary(h.last.sets))}</span>`);
  if (h?.bestW) out.push(`<span class="info-chip">Рекорд ${fmtW(h.bestW.w)} кг</span>`);
  else if (h?.bestReps) out.push(`<span class="info-chip">Рекорд ${h.bestReps.reps} повт.</span>`);
  return out.join('');
}
function setRowHtml(we, s) {
  const pr = isPR(we, s);
  return `<div class="set-row ${s.done ? 'done' : ''} ${pr ? 'pr' : ''}" data-set="${s.id}">
    <span class="set-n">${pr ? ic('trophy') : s.set_number}</span>
    <span class="plan">${esc(planStr(s))}</span>
    <input class="input cell" inputmode="decimal" enterkeyhint="next" data-f="actual_weight" value="${fmtW(s.actual_weight)}" placeholder="${fmtW(s.planned_weight)}" aria-label="Вес, подход ${s.set_number}">
    <input class="input cell" inputmode="numeric" enterkeyhint="done" data-f="actual_reps" value="${s.actual_reps ?? ''}" placeholder="${s.planned_reps ?? ''}" aria-label="Повторения, подход ${s.set_number}">
    <label class="tick"><input type="checkbox" data-f="done" ${s.done ? 'checked' : ''} aria-label="Подход ${s.set_number} выполнен"><span></span></label>
  </div>`;
}
function weHtml(we) {
  const e = exById(we.exercise_id) || { name: 'Упражнение удалено' };
  const allDone = we.sets.length > 0 && we.sets.every(s => s.done);
  return `<section class="we ${allDone ? 'done' : ''}" data-we="${we.id}">
    <div class="we-head">
      ${thumbEl(e, 'button', `data-view-ex="${e.id || ''}"`)}
      <div class="grow">
        <button class="we-name" data-view-ex="${e.id || ''}">${esc(e.name)}</button>
        ${e.equipment ? `<div class="we-sub">${esc(e.equipment)}</div>` : ''}
      </div>
      <button class="icon-btn" data-we-menu aria-label="Действия с упражнением">${ic('more')}</button>
    </div>
    <div class="we-info">${weInfoHtml(we)}</div>
    ${we.notes ? `<div class="we-note">${esc(we.notes)}</div>` : ''}
    <div class="sets">
      ${we.sets.length ? `<div class="set-row head"><span>№</span><span>План</span><span>Кг</span><span>Повт.</span><span></span></div>` : ''}
      ${we.sets.map(s => setRowHtml(we, s)).join('')}
    </div>
    <div class="we-foot">
      <button class="btn sm soft" data-add-set>${ic('plus')}Подход</button>
      ${we.sets.length ? `<button class="btn sm ghost" data-rm-set>${ic('minus')}Убрать последний</button>` : ''}
    </div>
  </section>`;
}
function durationHtml(w) {
  if (!w.started_at) return '';
  const start = new Date(w.started_at);
  if (w.finished_at) return `<span class="meta-note">${ic('clock')}${durationStr(new Date(w.finished_at) - start)}</span>`;
  const ms = Date.now() - start;
  if (w.completed || ms > 6 * 3600e3) return '';
  return `<span class="meta-note">${ic('clock')}идёт ${durationStr(ms)}</span>`;
}
function progressLabel(st) {
  return `<span>${st.done} из ${st.total} ${st.total % 10 === 1 && st.total % 100 !== 11 ? 'подхода' : 'подходов'}</span><span>${st.vol ? fmtTonnage(st.vol) : ''}</span>`;
}

function drawWorkout() {
  const w = state.w, list = w.workout_exercises, st = workoutStats(w), v = $('#view');
  const pct = st.total ? st.done / st.total * 100 : 0;
  v.innerHTML = `
    <div class="w-top">
      <button class="back" id="back">${ic('back')}План</button>
      <div class="row">
        <button class="icon-btn" id="w-timer" aria-label="Запустить таймер отдыха">${ic('timer')}</button>
        <button class="icon-btn" id="w-more" aria-label="Действия с тренировкой">${ic('more')}</button>
      </div>
    </div>
    <input class="title-input" id="w-title" value="${esc(w.title)}" placeholder="Название тренировки" aria-label="Название тренировки">
    <div class="w-meta">
      <label class="date-pill">${ic('calendar')}<span>${esc(fmtDateWd(w.date))}</span><input type="date" id="w-date" value="${w.date}" aria-label="Дата тренировки"></label>
      ${durationHtml(w)}
      ${w.completed ? '<span class="pill ok">выполнена</span>' : ''}
    </div>
    ${st.total ? `<div class="progress"><div class="progress-bar"><i id="prog-bar" style="width:${pct}%"></i></div><div class="progress-l" id="prog-l">${progressLabel(st)}</div></div>` : ''}
    <textarea class="input notes-input" id="w-notes" rows="1" placeholder="Заметка: самочувствие, что поменять в следующий раз">${esc(w.notes)}</textarea>
    <div id="we-list">${list.length ? list.map(weHtml).join('')
      : emptyHtml('Добавьте упражнения', 'Выберите упражнения из библиотеки и задайте подходы, повторения и вес.')}</div>
    <button class="btn soft block lg" id="add-we">${ic('plus')}Добавить упражнение</button>
    ${list.length ? (w.completed
      ? `<button class="btn ghost block mt" id="w-reopen">Вернуть в план</button>`
      : `<button class="btn success block lg mt" id="w-finish">${ic('flag')}Завершить тренировку</button>`) : ''}`;

  const saveW = async patch => {
    const { error } = await sb.from('workouts').update(patch).eq('id', w.id);
    if (error) { fail(error); return false; }
    Object.assign(w, patch);
    return true;
  };
  const notes = $('#w-notes');
  const autosize = () => { notes.style.height = 'auto'; notes.style.height = `${notes.scrollHeight + 2}px`; };
  autosize();
  notes.oninput = autosize;
  notes.onchange = () => saveW({ notes: notes.value.trim() || null });
  $('#w-title').onchange = e => saveW({ title: e.target.value.trim() || null });
  const dateIn = $('#w-date');
  dateIn.onclick = () => { try { dateIn.showPicker?.(); } catch { /* браузер откроет сам */ } };
  dateIn.onchange = async () => {
    if (!dateIn.value || dateIn.value === w.date) return;
    if (!await saveW({ date: dateIn.value })) return;
    goToWorkout(w);
  };

  v.onchange = async ev => {
    const inp = ev.target.closest('[data-f]');
    const row = inp?.closest('[data-set]');
    if (!row) return;
    const card = row.closest('[data-we]');
    const we = list.find(x => x.id === card.dataset.we);
    const s = we.sets.find(x => x.id === row.dataset.set);
    const f = inp.dataset.f;
    const wasPR = isPR(we, s);
    const patch = {};
    if (f === 'done') {
      patch.done = inp.checked;
      if (inp.checked) {
        if (s.actual_weight == null && s.planned_weight != null) patch.actual_weight = s.planned_weight;
        if (s.actual_reps == null && s.planned_reps != null) patch.actual_reps = s.planned_reps;
      }
    } else {
      const val = num(inp.value);
      if (val != null && (Number.isNaN(val) || val < 0)) {
        toast('Введите число', 'err');
        inp.value = f === 'actual_weight' ? fmtW(s[f]) : (s[f] ?? '');
        return;
      }
      patch[f] = f === 'actual_reps' && val != null ? Math.round(val) : val;
    }
    const { error } = await sb.from('sets').update(patch).eq('id', s.id);
    if (error) { if (f === 'done') inp.checked = !inp.checked; return fail(error); }
    Object.assign(s, patch);
    refreshCard(card, we);
    updateProgress();
    if (!s.done) return;
    const nowPR = isPR(we, s);
    const metric = x => x.actual_weight != null ? Number(x.actual_weight) : (x.actual_reps || 0);
    const beatsOthers = we.sets.every(x => x === s || !x.done || metric(x) < metric(s));
    if (nowPR && !wasPR && beatsOthers) {
      toast(`Новый рекорд: ${setStr(s)}`, 'pr');
      if (settings.vibrate) navigator.vibrate?.([30, 60, 30]);
    }
    if (f === 'done') {
      if (s.actual_reps == null) toast('Впишите повторения — тогда подход попадёт в прогресс');
      if (!w.started_at && 'started_at' in w) saveW({ started_at: new Date().toISOString() });
      if (settings.autoRest) startRest(restFor(exById(we.exercise_id)), exById(we.exercise_id)?.name);
    }
  };

  v.onkeydown = ev => {
    if (ev.key !== 'Enter' || !ev.target.matches('.cell')) return;
    ev.preventDefault();
    const cells = $$('.cell', v), i = cells.indexOf(ev.target);
    if (cells[i + 1]) cells[i + 1].focus(); else ev.target.blur();
  };

  v.onclick = async ev => {
    const t = ev.target;
    if (t.closest('#back')) { state.workoutId = null; return renderView(); }
    if (t.closest('#add-we')) return openAddExercise();
    if (t.closest('#w-timer')) return startRest(settings.rest, '');
    if (t.closest('#w-finish')) return finishWorkout();
    if (t.closest('#w-reopen')) {
      const patch = { completed: false };
      if ('finished_at' in w) patch.finished_at = null;
      if (await saveW(patch)) drawWorkout();
      return;
    }
    if (t.closest('#w-more')) {
      const k = await actionSheet(w.title || 'Тренировка', [
        { k: 'copy', icon: 'copy', label: 'Повторить в другой день' },
        { k: 'del', icon: 'trash', label: 'Удалить тренировку', danger: true },
      ]);
      if (k === 'copy') return openCopyWorkout();
      if (k === 'del') {
        if (!await confirmDialog({ title: 'Удалить тренировку?', text: 'Упражнения и отмеченные подходы этой тренировки удалятся. Библиотека упражнений не пострадает.' })) return;
        const { error } = await sb.from('workouts').delete().eq('id', w.id);
        if (error) return fail(error);
        toast('Тренировка удалена');
        state.workoutId = null;
        return renderView();
      }
      return;
    }
    const viewEx = t.closest('[data-view-ex]');
    if (viewEx && viewEx.dataset.viewEx) return openExerciseView(viewEx.dataset.viewEx);

    const card = t.closest('[data-we]');
    if (!card) return;
    const idx = list.findIndex(x => x.id === card.dataset.we);
    const we = list[idx];
    const ex = exById(we.exercise_id);

    if (t.closest('[data-we-menu]')) {
      const k = await actionSheet(ex?.name, [
        { k: 'up', icon: 'up', label: 'Переместить выше', disabled: idx === 0 },
        { k: 'down', icon: 'down', label: 'Переместить ниже', disabled: idx === list.length - 1 },
        { k: 'note', icon: 'note', label: we.notes ? 'Изменить заметку' : 'Заметка к упражнению' },
        { k: 'rest', icon: 'timer', label: `Таймер отдыха, ${mmss(restFor(ex))}` },
        { k: 'rm', icon: 'trash', label: 'Убрать из тренировки', danger: true },
      ]);
      if (k === 'up' || k === 'down') {
        const other = list[idx + (k === 'up' ? -1 : 1)];
        list.forEach((x, i) => x.position = i);
        [we.position, other.position] = [other.position, we.position];
        const [a, b] = await Promise.all([
          sb.from('workout_exercises').update({ position: we.position }).eq('id', we.id),
          sb.from('workout_exercises').update({ position: other.position }).eq('id', other.id),
        ]);
        if (a.error || b.error) return fail(a.error || b.error);
        list.sort((x, y) => x.position - y.position);
        drawWorkout();
        $(`[data-we="${we.id}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } else if (k === 'note') {
        openNoteEditor(we);
      } else if (k === 'rest') {
        startRest(restFor(ex), ex?.name);
      } else if (k === 'rm') {
        if (!await confirmDialog({ title: `Убрать «${ex?.name || 'упражнение'}»?`, text: 'Подходы этого упражнения в тренировке удалятся.', ok: 'Убрать' })) return;
        const { error } = await sb.from('workout_exercises').delete().eq('id', we.id);
        if (error) return fail(error);
        list.splice(idx, 1);
        drawWorkout();
      }
      return;
    }
    if (t.closest('[data-add-set]')) {
      const last = we.sets[we.sets.length - 1];
      const { data, error } = await sb.from('sets').insert({
        workout_exercise_id: we.id, set_number: (last?.set_number || 0) + 1,
        planned_reps: last?.actual_reps ?? last?.planned_reps ?? null,
        planned_weight: last?.actual_weight ?? last?.planned_weight ?? null,
      }).select().single();
      if (error) return fail(error);
      we.sets.push(data);
      return drawWorkout();
    }
    if (t.closest('[data-rm-set]')) {
      const last = we.sets[we.sets.length - 1];
      if (!last) return;
      const { error } = await sb.from('sets').delete().eq('id', last.id);
      if (error) return fail(error);
      we.sets.pop();
      return drawWorkout();
    }
  };
}

function refreshCard(card, we) {
  for (const s of we.sets) {
    const row = $(`[data-set="${s.id}"]`, card);
    if (!row) continue;
    const pr = isPR(we, s);
    row.classList.toggle('done', !!s.done);
    row.classList.toggle('pr', pr);
    $('.set-n', row).innerHTML = pr ? ic('trophy') : s.set_number;
    const wi = $('[data-f="actual_weight"]', row), ri = $('[data-f="actual_reps"]', row);
    if (document.activeElement !== wi) wi.value = fmtW(s.actual_weight);
    if (document.activeElement !== ri) ri.value = s.actual_reps ?? '';
    $('[data-f="done"]', row).checked = !!s.done;
  }
  card.classList.toggle('done', we.sets.length > 0 && we.sets.every(s => s.done));
  $('.we-info', card).innerHTML = weInfoHtml(we);
}
function updateProgress() {
  const bar = $('#prog-bar'), l = $('#prog-l');
  if (!bar) return;
  const st = workoutStats(state.w);
  bar.style.width = `${st.total ? st.done / st.total * 100 : 0}%`;
  l.innerHTML = progressLabel(st);
}

function openNoteEditor(we) {
  const ex = exById(we.exercise_id);
  const m = openModal(`${sheetHead('Заметка к упражнению')}
    <form class="form" id="note-form">
      <p class="hint" style="margin:-8px 0 0">${esc(ex?.name || '')}. Заметка относится только к этой тренировке и скопируется при повторе.</p>
      <textarea class="input" name="note" rows="4" autofocus placeholder="Например, последний подход с паузой внизу">${esc(we.notes)}</textarea>
      <button class="btn primary block" type="submit">Сохранить</button>
    </form>`, { cls: 'small' });
  $('#note-form', m.el).onsubmit = async ev => {
    ev.preventDefault();
    const val = new FormData(ev.target).get('note').trim() || null;
    const { error } = await sb.from('workout_exercises').update({ notes: val }).eq('id', we.id);
    if (error) return fail(error);
    we.notes = val;
    m.close(true);
    drawWorkout();
  };
}

async function finishWorkout() {
  const w = state.w;
  const st0 = workoutStats(w);
  if (st0.done < st0.total && !await confirmDialog({
    title: 'Завершить тренировку?', text: `Отмечено ${st0.done} из ${st0.total} подходов. Неотмеченные не попадут в прогресс.`, ok: 'Завершить', danger: false,
  })) return;
  const patch = { completed: true };
  if ('finished_at' in w) patch.finished_at = new Date().toISOString();
  const { error } = await sb.from('workouts').update(patch).eq('id', w.id);
  if (error) return fail(error);
  Object.assign(w, patch);
  stopRest();
  const st = workoutStats(w);
  const dur = w.started_at ? new Date(w.finished_at || Date.now()) - new Date(w.started_at) : null;
  openModal(`<div class="finish">
    <div class="finish-mark">${ic('check')}</div>
    <h2>Тренировка завершена</h2>
    <p class="muted" style="margin:0">${esc(w.title || dayTitle(w.date))}</p>
    <div class="stats3">
      ${stat(dur ? durationStr(dur) : '—', 'длительность')}
      ${stat(String(st.done), plural(st.done, ['подход', 'подхода', 'подходов']))}
      ${stat(st.vol ? fmtTonnage(st.vol) : '0', 'поднято')}
    </div>
    ${st.prs ? `<span class="pill pr big">${ic('trophy')}${st.prs} ${plural(st.prs, ['новый рекорд', 'новых рекорда', 'новых рекордов'])}</span>` : ''}
    <button class="btn primary block lg mt" data-close>Готово</button>
  </div>`, { cls: 'small' });
  drawWorkout();
}

function stepLine(label, name, val, step, mode) {
  return `<div class="step-line"><span class="label">${label}</span><div class="stepper">
    <button type="button" data-step="${-step}" aria-label="Уменьшить: ${label}">${ic('minus')}</button>
    <input name="${name}" inputmode="${mode}" value="${val}" aria-label="${label}">
    <button type="button" data-step="${step}" aria-label="Увеличить: ${label}">${ic('plus')}</button></div></div>`;
}

function openAddExercise() {
  const w = state.w;
  let chosen = null, q = '', g = '';
  const inWorkout = new Set(w.workout_exercises.map(x => x.exercise_id));
  const gs = groups();
  const m = openModal(`${sheetHead('Добавить упражнение')}
    <div id="pk-pick">
      <label class="search">${ic('search')}<input class="input" id="pk-search" type="search" placeholder="Название или тренажёр" aria-label="Поиск" autofocus></label>
      ${gs.length ? `<div class="chips mt-sm" id="pk-groups">${chip('', 'Все', true)}${gs.map(x => chip(x, x, false)).join('')}</div>` : ''}
      <div class="list mt" id="pk-list"></div>
      <button class="btn block mt" id="pk-new">${ic('plus')}Создать новое упражнение</button>
    </div>
    <form class="form" id="pk-form" hidden>
      <div id="pk-chosen"></div>
      <div class="we-info" id="pk-prev" style="margin-top:0"></div>
      <div>
        ${stepLine('Подходы', 'n', 3, 1, 'numeric')}
        ${stepLine('Повторения', 'reps', 10, 1, 'numeric')}
        ${stepLine('Вес, кг', 'w', '', 2.5, 'decimal')}
      </div>
      <div class="row gap"><button type="button" class="btn ghost" id="pk-back">${ic('back')}Назад</button><span class="grow"></span><button class="btn primary" type="submit">${ic('plus')}Добавить</button></div>
    </form>`);
  const el = m.el;
  const drawList = () => {
    const items = filterExercises(activeExercises(), q, g);
    $('#pk-list', el).innerHTML = items.length
      ? items.map(e => exRow(e, inWorkout.has(e.id) ? '<span class="pill plan">уже есть</span>' : '')).join('')
      : `<div class="empty">${activeExercises().length ? 'Ничего не найдено' : 'Библиотека пуста — создайте первое упражнение'}</div>`;
  };
  drawList();
  $('#pk-search', el).oninput = e => { q = e.target.value; drawList(); };
  $$('#pk-groups .chip', el).forEach(c => c.onclick = () => {
    g = c.dataset.g; $$('#pk-groups .chip', el).forEach(x => x.classList.toggle('active', x === c)); drawList();
  });
  $('#pk-new', el).onclick = () => openExerciseForm(null, ex => choose(ex.id));
  $('#pk-list', el).onclick = e => { const c = e.target.closest('[data-ex]'); if (c) choose(c.dataset.ex); };
  $('#pk-back', el).onclick = () => { chosen = null; $('#pk-form', el).hidden = true; $('#pk-pick', el).hidden = false; };
  const form = $('#pk-form', el);
  form.onclick = e => {
    const b = e.target.closest('[data-step]');
    if (!b) return;
    const inp = $('input', b.closest('.stepper'));
    const step = Number(b.dataset.step), min = inp.name === 'n' ? 1 : 0;
    const val = Math.max(min, Math.round(((num(inp.value) || 0) + step) * 100) / 100);
    inp.value = inp.name === 'w' ? fmtW(val) : String(val);
  };

  async function choose(id) {
    chosen = exById(id);
    if (!chosen) return;
    $('#pk-pick', el).hidden = true;
    form.hidden = false;
    $('#pk-chosen', el).innerHTML = exRow(chosen, '', 'div');
    $('#pk-prev', el).innerHTML = '';
    const h = (await loadExerciseHistory([id], { before: w.date }))[id];
    if (chosen?.id !== id) return;
    if (h) {
      state.hist[id] = h;
      $('#pk-prev', el).innerHTML = weInfoHtml({ exercise_id: id, sets: [] });
      const top = h.last.sets.reduce((a, s) => (Number(s.actual_weight ?? -1) > Number(a?.actual_weight ?? -1) ? s : a), null);
      form.n.value = h.last.sets.length || 3;
      if (top) { form.reps.value = top.actual_reps ?? ''; form.w.value = fmtW(top.actual_weight); }
    }
  }

  form.onsubmit = async ev => {
    ev.preventDefault();
    if (!chosen) return;
    const n = Math.min(20, Math.max(1, Math.round(num(form.n.value) || 1)));
    const reps = num(form.reps.value), wt = num(form.w.value);
    if ([reps, wt].some(x => x != null && (Number.isNaN(x) || x < 0))) return toast('Повторения и вес должны быть числами', 'err');
    const btn = $('button[type=submit]', form); btn.disabled = true;
    const pos = w.workout_exercises.reduce((mx, x) => Math.max(mx, x.position), -1) + 1;
    const { data: we, error } = await sb.from('workout_exercises').insert({ workout_id: w.id, exercise_id: chosen.id, position: pos }).select().single();
    if (error) { btn.disabled = false; return fail(error); }
    const rows = Array.from({ length: n }, (_, i) => ({
      workout_exercise_id: we.id, set_number: i + 1,
      planned_reps: reps == null ? null : Math.round(reps), planned_weight: wt,
    }));
    const { data: sets, error: e2 } = await sb.from('sets').insert(rows).select();
    if (e2) { btn.disabled = false; return fail(e2); }
    we.sets = sets.sort((a, b) => a.set_number - b.set_number);
    w.workout_exercises.push(we);
    m.close(true);
    drawWorkout();
    $(`[data-we="${we.id}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  };
}

function openCopyWorkout() {
  const w = state.w;
  const m = openModal(`${sheetHead('Повторить тренировку')}
    <form class="form" id="cp-form">
      <label class="field"><span class="label">Новая дата</span><input class="input" type="date" name="date" required value="${addDays(w.date, 7)}"></label>
      <label class="field"><span class="label">Название</span><input class="input" name="title" value="${esc(w.title)}"></label>
      <p class="hint" style="margin:0">Упражнения и подходы скопируются. Если подход был выполнен, его фактический вес и повторения станут новым планом.</p>
      <button class="btn primary block lg" type="submit">${ic('copy')}Создать копию</button>
    </form>`, { cls: 'small' });
  $('#cp-form', m.el).onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target), btn = $('button[type=submit]', ev.target);
    btn.disabled = true;
    try {
      const nw = await copyWorkout(w, fd.get('date'), fd.get('title').trim());
      m.close(true);
      toast(`Скопировано на ${shortDate(nw.date)}`, 'ok');
      goToWorkout(nw);
    } catch (err) { fail(err); btn.disabled = false; }
  };
}

// =====================================================================
// Таймер отдыха
// =====================================================================
const rest = { end: 0, total: 0, label: '', iv: null, hideT: null, wake: null, finished: false };
let audioCtx = null;
function startRest(sec, label) {
  sec = Math.max(5, Math.round(sec));
  Object.assign(rest, { total: sec, end: Date.now() + sec * 1000, label: label || '', finished: false });
  clearTimeout(rest.hideT);
  if (settings.sound) {
    try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume?.(); } catch { /* без звука */ }
  }
  requestWake();
  clearInterval(rest.iv);
  rest.iv = setInterval(tickRest, 250);
  renderRest();
  tickRest();
}
function adjustRest(d) {
  if (rest.finished) { if (d > 0) startRest(d, rest.label); return; }
  rest.end += d * 1000;
  const left = (rest.end - Date.now()) / 1000;
  if (left > rest.total) rest.total = Math.ceil(left);
  tickRest();
}
function stopRest() {
  clearInterval(rest.iv); rest.iv = null; rest.end = 0; rest.finished = false;
  clearTimeout(rest.hideT);
  releaseWake();
  document.body.classList.remove('has-rest');
  const r = $('#rest-root');
  if (r) r.innerHTML = '';
}
function renderRest() {
  const root = $('#rest-root');
  if (!root) return;
  if (!rest.end) { root.innerHTML = ''; document.body.classList.remove('has-rest'); return; }
  document.body.classList.add('has-rest');
  root.innerHTML = `<div class="rest" id="rest" role="timer">
    <div class="grow"><div class="rest-l" id="rest-l"></div><div class="rest-time" id="rest-time">0:00</div></div>
    <button data-r="-15" aria-label="Минус 15 секунд">−15</button>
    <button data-r="15" aria-label="Плюс 15 секунд">+15</button>
    <button data-r="x" aria-label="Закрыть таймер">${ic('x')}</button>
    <i class="rest-bar" id="rest-bar"></i>
  </div>`;
  root.firstElementChild.onclick = e => {
    const b = e.target.closest('[data-r]');
    if (!b) return;
    if (b.dataset.r === 'x') return stopRest();
    adjustRest(Number(b.dataset.r));
  };
}
function tickRest() {
  if (!rest.end) return;
  const t = $('#rest-time');
  if (!t) return;
  const leftMs = rest.end - Date.now();
  if (leftMs <= 0 && !rest.finished) {
    rest.finished = true;
    clearInterval(rest.iv); rest.iv = null;
    beep();
    if (settings.vibrate) navigator.vibrate?.([250, 120, 250]);
    releaseWake();
    rest.hideT = setTimeout(stopRest, 12000);
  }
  if (rest.finished) {
    $('#rest').classList.add('finished');
    t.textContent = 'Пора!';
    $('#rest-l').textContent = rest.label ? `Следующий подход, ${rest.label}` : 'Отдых окончен';
    $('#rest-bar').style.width = '0%';
    return;
  }
  t.textContent = mmss(Math.ceil(leftMs / 1000));
  $('#rest-l').textContent = rest.label ? `Отдых, ${rest.label}` : 'Отдых';
  $('#rest-bar').style.width = `${Math.max(0, Math.min(100, leftMs / (rest.total * 1000) * 100))}%`;
}
function beep() {
  if (!settings.sound || !audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    [0, 0.22, 0.44].forEach((d, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + d); o.stop(t0 + d + 0.2);
    });
  } catch { /* без звука */ }
}
async function requestWake() {
  try {
    if ('wakeLock' in navigator && !rest.wake) {
      rest.wake = await navigator.wakeLock.request('screen');
      rest.wake.addEventListener?.('release', () => { rest.wake = null; });
    }
  } catch { /* не поддерживается */ }
}
function releaseWake() { try { rest.wake?.release(); } catch { /* уже отпущен */ } rest.wake = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && rest.end && !rest.finished) { requestWake(); tickRest(); }
});

// =====================================================================
// Прогресс
// =====================================================================
function sessionMetrics(date, workoutId, sets) {
  sets = sets.slice().sort((a, b) => a.set_number - b.set_number);
  const ws = sets.map(x => x.actual_weight).filter(x => x != null).map(Number);
  const e1 = sets.filter(x => x.actual_weight != null && x.actual_reps > 0).map(x => e1rm(Number(x.actual_weight), x.actual_reps));
  return {
    date, workoutId, sets,
    maxW: ws.length ? Math.max(...ws) : null,
    volume: sets.reduce((a, x) => a + x.actual_reps * (Number(x.actual_weight) || 0), 0),
    reps: sets.reduce((a, x) => a + x.actual_reps, 0),
    maxReps: Math.max(...sets.map(x => x.actual_reps)),
    e1rm: e1.length ? Math.max(...e1) : null,
  };
}
function groupSessions(rows) {
  const byDate = {};
  for (const r of rows) {
    const sets = r.sets.filter(s => s.done && s.actual_reps != null);
    if (!sets.length) continue;
    const d = r.workouts.date;
    (byDate[d] ||= { workoutId: r.workouts.id || r.workout_id, sets: [] }).sets.push(...sets);
  }
  return Object.entries(byDate).sort(([a], [b]) => a.localeCompare(b)).map(([d, x]) => sessionMetrics(d, x.workoutId, x.sets));
}
function spark(vals) {
  vals = vals.filter(v => v != null).slice(-12);
  if (vals.length < 2) return '<span class="spark"></span>';
  const min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1, W = 72, H = 28, p = 3;
  const pts = vals.map((v, i) => `${(p + i * (W - 2 * p) / (vals.length - 1)).toFixed(1)},${(H - p - (v - min) / r * (H - 2 * p)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

async function renderProgress() {
  setHeader('Прогресс');
  const v = $('#view');
  v.innerHTML = spinner();
  let rows, cnt;
  try {
    [rows, cnt] = await Promise.all([
      fetchAll(() => sb.from('workout_exercises').select('id, exercise_id, workout_id, workouts!inner(id, date), sets(set_number, actual_reps, actual_weight, done)').order('id')),
      sb.from('workouts').select('id', { count: 'exact', head: true }).eq('completed', true),
    ]);
    if (cnt.error) throw cnt.error;
  } catch (e) { return fail(e); }
  if (state.tab !== 'progress' || state.progressExId) return;
  const byEx = {};
  for (const r of rows) (byEx[r.exercise_id] ||= []).push(r);
  let totalSets = 0, totalVol = 0;
  const items = [];
  for (const [id, rs] of Object.entries(byEx)) {
    const sessions = groupSessions(rs);
    if (!sessions.length) continue;
    for (const s of sessions) { totalSets += s.sets.length; totalVol += s.volume; }
    const e = exById(id);
    if (!e) continue;
    const hasW = sessions.some(s => s.maxW != null);
    const best = hasW ? Math.max(...sessions.map(s => s.maxW ?? -1)) : Math.max(...sessions.map(s => s.maxReps));
    items.push({ e, sessions, hasW, best, last: sessions[sessions.length - 1].date });
  }
  items.sort((a, b) => b.last.localeCompare(a.last));
  const done = cnt.count || 0;
  v.innerHTML = `
    <section class="card"><div class="stats3">
      ${stat(String(done), plural(done, ['тренировка', 'тренировки', 'тренировок']))}
      ${stat(fmtNum(totalSets), plural(totalSets, ['подход', 'подхода', 'подходов']))}
      ${stat(totalVol ? fmtTonnage(totalVol) : '0', 'поднято всего')}
    </div></section>
    <div class="section-head"><h2 class="section-title">Упражнения</h2><span class="hint">свежие сверху</span></div>
    ${items.length ? `<div class="list">${items.map(it => `<button class="rec-item" data-ex="${it.e.id}">
        ${thumbEl(it.e)}
        <span class="grow"><span class="ex-name one">${esc(it.e.name)}</span>
          <span class="ex-sub">${it.sessions.length} ${plural(it.sessions.length, ['тренировка', 'тренировки', 'тренировок'])}, последняя ${shortDate(it.last)}</span></span>
        ${spark(it.sessions.map(s => it.hasW ? s.maxW : s.maxReps))}
        <span class="rec-r"><span class="rec-v">${it.hasW ? `${fmtW(it.best)} кг` : `${it.best} повт.`}</span><span class="rec-d">рекорд</span></span>
      </button>`).join('')}</div>`
      : emptyHtml('Здесь появится прогресс', 'Отмечайте выполненные подходы в тренировках — рекорды и графики соберутся сами.')}`;
  v.onclick = e => {
    const b = e.target.closest('[data-ex]');
    if (!b) return;
    state.progressExId = b.dataset.ex; state.metric = null;
    renderView(); window.scrollTo(0, 0);
  };
}

async function renderProgressExercise() {
  setHeader('Прогресс');
  const id = state.progressExId, e = exById(id), v = $('#view');
  if (!e) { state.progressExId = null; return renderView(); }
  v.innerHTML = spinner();
  let rows;
  try {
    rows = await fetchAll(() => sb.from('workout_exercises')
      .select('id, workout_id, workouts!inner(id, date), sets(set_number, actual_reps, actual_weight, done)').eq('exercise_id', id).order('id'));
  } catch (err) { return fail(err); }
  if (state.tab !== 'progress' || state.progressExId !== id) return;
  const sessions = groupSessions(rows);
  const hasW = sessions.some(s => s.maxW != null);
  let bestSoFar = null;
  for (const s of sessions) {
    const m = hasW ? s.maxW : s.maxReps;
    s.pr = m != null && bestSoFar != null && m > bestSoFar;
    if (m != null && (bestSoFar == null || m > bestSoFar)) bestSoFar = m;
  }
  const METRICS = hasW
    ? { maxW: 'Макс. вес', e1rm: 'Расчётный 1ПМ', volume: 'Объём', reps: 'Повторения' }
    : { maxReps: 'Лучший подход', reps: 'Повторения за тренировку' };
  const UNITS = { maxW: 'кг', e1rm: 'кг', volume: 'кг', reps: 'повт.', maxReps: 'повт.' };
  if (!state.metric || !METRICS[state.metric]) state.metric = Object.keys(METRICS)[0];
  const meta = [e.muscle_group, e.equipment].filter(Boolean).join(', ');
  const best = k => sessions.reduce((a, s) => (s[k] ?? -1) > (a?.[k] ?? -1) ? s : a, null);

  let statsHtml = '';
  if (sessions.length) {
    const bw = best('maxW'), be = best('e1rm'), br = best('maxReps');
    statsHtml = hasW
      ? stat(`${fmtW(bw.maxW)}<small> кг</small>`, `рекорд, ${shortDate(bw.date)}`) + stat(`${fmtW(r1(be.e1rm))}<small> кг</small>`, 'расчётный 1ПМ') + stat(String(sessions.length), plural(sessions.length, ['тренировка', 'тренировки', 'тренировок']))
      : stat(`${br.maxReps}<small> повт.</small>`, `рекорд, ${shortDate(br.date)}`) + stat(String(sessions.length), plural(sessions.length, ['тренировка', 'тренировки', 'тренировок'])) + stat(shortDate(sessions[sessions.length - 1].date), 'последняя');
  }
  v.innerHTML = `
    <button class="back" id="pr-back">${ic('back')}Все упражнения</button>
    <div class="px-head">${thumbEl(e, 'button', `data-view-ex="${id}"`)}<div class="grow"><h2 class="px-title">${esc(e.name)}</h2>${meta ? `<div class="we-sub">${esc(meta)}</div>` : ''}</div></div>
    ${!sessions.length ? emptyHtml('Пока нет данных', 'Отмечайте подходы галочкой во время тренировки — результаты появятся здесь.') : `
    <section class="card"><div class="stats3">${statsHtml}</div></section>
    <section class="card mt">
      <div class="chips" id="pr-metrics">${Object.entries(METRICS).map(([k, l]) => `<button class="chip ${k === state.metric ? 'active' : ''}" data-m="${k}">${l}</button>`).join('')}</div>
      <div class="chart-box"><canvas id="pr-chart" aria-label="График прогресса"></canvas></div>
      <p class="hint" id="pr-note" style="margin:10px 0 0"></p>
    </section>
    <div class="section-head"><h2 class="section-title">История</h2><span class="hint">${sessions.length} ${plural(sessions.length, ['тренировка', 'тренировки', 'тренировок'])}</span></div>
    <div class="list">${[...sessions].reverse().map(s => `<button class="w-item" data-w="${s.workoutId}" data-date="${s.date}">
      <span class="grow"><span class="w-title">${esc(cap(fmtDateWd(s.date)))}</span><span class="w-sub">${esc(s.sets.map(setStr).join(', '))}${hasW && s.volume ? `, объём ${fmtNum(s.volume)} кг` : ''}</span></span>
      ${s.pr ? `<span class="pill pr">${ic('trophy')}рекорд</span>` : ''}${ic('chev', 'chev')}</button>`).join('')}</div>`}`;

  const drawChart = () => {
    if (state.chart) { state.chart.destroy(); state.chart = null; }
    const k = state.metric;
    $('#pr-note').textContent = k === 'e1rm' ? 'Оценка по формуле Эпли: вес × (1 + повторения / 30). Точнее всего для 1–10 повторений.'
      : k === 'volume' ? 'Объём — сумма вес × повторения по всем выполненным подходам за тренировку.' : '';
    if (typeof Chart === 'undefined') { $('.chart-box').innerHTML = '<p class="hint">График не загрузился: cdn.jsdelivr.net недоступен.</p>'; return; }
    const css = getComputedStyle(document.documentElement);
    const c = n => css.getPropertyValue(n).trim();
    const pts = sessions.filter(s => s[k] != null);
    state.chart = new Chart($('#pr-chart'), {
      type: 'line',
      data: {
        labels: pts.map(s => shortDate(s.date)),
        datasets: [{
          data: pts.map(s => r1(s[k])), borderColor: c('--accent'), backgroundColor: c('--accent-soft'),
          fill: true, borderWidth: 3, tension: 0.3, pointRadius: pts.length > 24 ? 0 : 4, pointHoverRadius: 6,
          pointBackgroundColor: pts.map(s => s.pr ? c('--pr') : c('--accent')), pointBorderColor: c('--surface'), pointBorderWidth: 2,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { displayColors: false, callbacks: { label: ctx => `${String(ctx.parsed.y).replace('.', ',')} ${UNITS[k]}` } },
        },
        scales: {
          x: { ticks: { color: c('--muted'), maxRotation: 0, autoSkip: true, maxTicksLimit: 6, font: { family: 'Onest' } }, grid: { display: false }, border: { display: false } },
          y: { ticks: { color: c('--muted'), maxTicksLimit: 5, font: { family: 'Onest' } }, grid: { color: c('--line') }, border: { display: false }, beginAtZero: k === 'volume' || k === 'reps' },
        },
      },
    });
  };
  if (sessions.length) drawChart();
  v.onclick = ev => {
    const t = ev.target;
    if (t.closest('#pr-back')) { state.progressExId = null; return renderView(); }
    const ve = t.closest('[data-view-ex]');
    if (ve) return openExerciseView(ve.dataset.viewEx);
    const mc = t.closest('[data-m]');
    if (mc) { state.metric = mc.dataset.m; $$('#pr-metrics .chip').forEach(x => x.classList.toggle('active', x === mc)); return drawChart(); }
    const r = t.closest('[data-w]');
    if (r) goToWorkout({ id: r.dataset.w, date: r.dataset.date });
  };
}

// =====================================================================
// Настройки и резервная копия
// =====================================================================
function openSettings() {
  const sw = k => `<label class="switch"><input type="checkbox" data-s="${k}" ${settings[k] ? 'checked' : ''}><span></span></label>`;
  const m = openModal(`${sheetHead('Настройки')}
    <div class="pref-title">Таймер отдыха</div>
    <div class="pref-group">
      <div class="pref-item"><span class="grow">Запускать после отмеченного подхода</span>${sw('autoRest')}</div>
      <div class="pref-item col"><span>Отдых по умолчанию</span>
        <div class="seg" id="rest-seg">${[60, 90, 120, 180].map(s => `<button data-v="${s}" class="${settings.rest === s ? 'active' : ''}">${mmss(s)}</button>`).join('')}</div>
        <span class="hint">Для отдельного упражнения время можно задать в его карточке.</span>
      </div>
      <div class="pref-item"><span class="grow">Звуковой сигнал</span>${sw('sound')}</div>
      <div class="pref-item"><span class="grow">Вибрация</span>${sw('vibrate')}</div>
    </div>
    <div class="pref-title">Оформление</div>
    <div class="pref-group"><div class="pref-item">
      <div class="seg grow" id="theme-seg">${[['auto', 'Авто'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(([k, l]) => `<button data-v="${k}" class="${settings.theme === k ? 'active' : ''}">${l}</button>`).join('')}</div>
    </div></div>
    <div class="pref-title">Данные</div>
    <div class="pref-group">
      <button class="pref-item" id="export">${ic('download')}<span class="grow">Скачать резервную копию</span></button>
      <button class="pref-item danger" id="logout">${ic('logout')}<span class="grow">Выйти</span><span class="hint">${esc(state.user?.email || '')}</span></button>
    </div>
    <p class="hint center mt">Подход, версия ${APP_VERSION}</p>`, { cls: 'small' });
  const el = m.el;
  el.addEventListener('change', e => { const k = e.target.dataset?.s; if (k) { settings[k] = e.target.checked; saveSettings(); } });
  $('#rest-seg', el).onclick = e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    settings.rest = Number(b.dataset.v); saveSettings();
    $$('#rest-seg button', el).forEach(x => x.classList.toggle('active', x === b));
  };
  $('#theme-seg', el).onclick = e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    settings.theme = b.dataset.v; saveSettings();
    $$('#theme-seg button', el).forEach(x => x.classList.toggle('active', x === b));
    if (state.chart) renderView();
  };
  $('#export', el).onclick = exportData;
  $('#logout', el).onclick = async () => { closeAllModals(); stopRest(); await sb.auth.signOut(); };
}
async function exportData() {
  try {
    toast('Готовлю копию…');
    const out = { app: 'podhod', version: APP_VERSION, exported_at: new Date().toISOString() };
    for (const t of ['exercises', 'workouts', 'workout_exercises', 'sets']) out[t] = await fetchAll(() => sb.from(t).select('*').order('id'));
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `podhod-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Копия скачана', 'ok');
  } catch (e) { fail(e); }
}

boot();
