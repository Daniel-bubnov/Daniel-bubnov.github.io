<style>
/* ============ Токены ============ */
:root {
  --bg: #EEF0F4;
  --surface: #FFFFFF;
  --surface-2: #F3F4F7;
  --ink: #10162A;
  --muted: #636C81;
  --line: #DDE1E9;
  --accent: #2A45F0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EAFF;
  --done: #0B8F63;
  --done-soft: #DCF4EA;
  --done-ink: #FFFFFF;
  --pr: #F0A500;
  --pr-soft: #FFF1CC;
  --pr-ink: #7A4F00;
  --danger: #D1293D;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Unbounded", "Onest", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1322; --surface: #171E32; --surface-2: #20283F; --ink: #EEF1F8; --muted: #9AA3B8;
    --line: #2A3350; --accent: #7C92FF; --accent-ink: #0B1020; --accent-soft: #222C55;
    --done: #3DD598; --done-soft: #143629; --done-ink: #062418; --pr: #FFC23D; --pr-soft: #3A2E10; --pr-ink: #FFD47A;
    --danger: #FF6B7D; color-scheme: dark;
  }
  :root:not([data-theme="light"]) .ph { background: hsl(var(--h) 32% 22%); color: hsl(var(--h) 75% 78%); }
}
:root[data-theme="dark"] {
  --bg: #0E1322; --surface: #171E32; --surface-2: #20283F; --ink: #EEF1F8; --muted: #9AA3B8;
  --line: #2A3350; --accent: #7C92FF; --accent-ink: #0B1020; --accent-soft: #222C55;
  --done: #3DD598; --done-soft: #143629; --done-ink: #062418; --pr: #FFC23D; --pr-soft: #3A2E10; --pr-ink: #FFD47A;
  --danger: #FF6B7D; color-scheme: dark;
}
:root[data-theme="dark"] .ph { background: hsl(var(--h) 32% 22%); color: hsl(var(--h) 75% 78%); }

/* ============ База ============ */
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img, video { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
.center { text-align: center; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; }
.gap { gap: 8px; }
.mt { margin-top: 16px; }
.mt-sm { margin-top: 10px; }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 20px; height: 20px; flex: none; display: inline-block; }
.ico svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mark { width: 30px; height: 30px; flex: none; display: block; }
.mark svg { width: 100%; height: 100%; display: block; }
.ph.ph { background: hsl(var(--h) 70% 92%); color: hsl(var(--h) 55% 34%); }

/* ============ Шапка и навигация ============ */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
  transition: box-shadow .2s;
}
.topbar.scrolled { box-shadow: 0 1px 0 var(--line); }
.topbar-in { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.page-title { flex: 1; min-width: 0; margin: 0; font: 700 21px/1.15 var(--display); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main.wrap { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
body.has-rest main.wrap { padding-bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface);
  border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tabbar-in { max-width: 520px; margin: 0 auto; display: flex; gap: 4px; }
.tab {
  flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 5px 4px 4px; color: var(--muted); font-size: 12px; font-weight: 600;
}
.tab-pill { display: grid; place-items: center; width: 58px; height: 30px; border-radius: 999px; transition: background .2s; }
.tab-pill .ico { width: 23px; height: 23px; }
.tab.active { color: var(--accent); }
.tab.active .tab-pill { background: var(--accent-soft); }

/* ============ Кнопки и поля ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn .ico { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.success { background: var(--done); border-color: var(--done); color: var(--done-ink); }
.btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface); }
.btn.danger { color: var(--danger); }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 11px; gap: 6px; }
.btn.sm .ico { width: 16px; height: 16px; }
.btn.lg { min-height: 54px; font-size: 16px; border-radius: 16px; }
.btn.block { display: flex; width: 100%; }
.icon-btn {
  width: 40px; height: 40px; flex: none; display: inline-grid; place-items: center;
  border: 0; border-radius: 12px; background: transparent; color: var(--muted);
}
.icon-btn:hover { background: var(--surface); color: var(--ink); }
.icon-btn:disabled { opacity: .3; pointer-events: none; }
.icon-btn .ico { width: 22px; height: 22px; }
.input {
  width: 100%; min-height: 46px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); outline: none; font-size: 16px; transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; line-height: 1.4; }
.search { position: relative; display: block; }
.search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search .input { padding-left: 42px; }
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 7px; }
.label { font-size: 14px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chips.bleed { margin: 0 -16px; padding-inline: 16px; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 14px; font-size: 14px; font-weight: 500;
}
.chip.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s; }
.switch input:checked + span { background: var(--done); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.stepper { display: flex; align-items: center; width: 168px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stepper button { width: 46px; height: 48px; flex: none; border: 0; background: none; color: var(--accent); display: grid; place-items: center; }
.stepper button:active { background: var(--accent-soft); }
.stepper input { flex: 1; min-width: 0; height: 48px; border: 0; background: none; outline: none; text-align: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0; }
.step-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }

/* ============ Общие блоки ============ */
.card { background: var(--surface); border-radius: 20px; padding: 16px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 0 12px; }
.section-title { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.section-title::first-letter { text-transform: uppercase; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.empty { text-align: center; padding: 32px 20px; color: var(--muted); background: var(--surface); border-radius: 20px; }
.empty-t { display: block; color: var(--ink); font-weight: 700; font-size: 17px; margin-bottom: 6px; }
.empty .btn { margin-top: 18px; }
.loading { padding: 56px 0; display: grid; place-items: center; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat-v { font: 600 21px/1.15 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-v small { font: 500 14px var(--font); color: var(--muted); letter-spacing: 0; }
.stat-l { font-size: 12.5px; color: var(--muted); margin-top: 5px; line-height: 1.25; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.pill .ico { width: 14px; height: 14px; }
.pill.ok { background: var(--done-soft); color: var(--done); }
.pill.plan { background: var(--accent-soft); color: var(--accent); }
.pill.pr { background: var(--pr-soft); color: var(--pr-ink); }
.pill.big { font-size: 15px; padding: 8px 14px; }
.chev { width: 18px; height: 18px; color: var(--muted); }

/* ============ План ============ */
.week { padding: 18px 16px; }
.week-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.week-title { font-weight: 700; }
.cal { margin-top: 12px; padding: 12px 10px 14px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px; }
.cal-title { font: 600 15px var(--display); letter-spacing: -0.01em; }
.cal-head .icon-btn:hover { background: var(--surface-2); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px 0 6px; }
.day {
  position: relative; aspect-ratio: 1; border: 0; border-radius: 12px; background: transparent;
  display: grid; place-items: center; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink);
}
.day:hover { background: var(--surface-2); }
@media (min-width: 560px) { .day { aspect-ratio: auto; height: 54px; } }
.day.plan { background: var(--accent-soft); color: var(--accent); }
.day.done { background: var(--done-soft); color: var(--done); }
.day.today::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: currentColor; }
.day.sel { background: var(--accent); color: var(--accent-ink); }
.day .cnt { position: absolute; top: 3px; right: 5px; font-size: 10px; font-weight: 700; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); margin: 12px 4px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.w-item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0;
  background: var(--surface); border-radius: 16px; padding: 14px 14px 14px 16px; transition: background .15s;
}
.w-item:hover { background: var(--surface-2); }
.w-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.w-dot.ok { background: var(--done); }
.w-title { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w-sub { display: block; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day-empty { color: var(--muted); padding: 4px 2px 0; margin: 0; }

/* ============ Тренировка ============ */
.w-top { display: flex; align-items: center; justify-content: space-between; margin: 0 -8px 4px 0; }
.back { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 8px 6px 0; font-size: 15px; }
.back .ico { width: 20px; height: 20px; }
.title-input { width: 100%; border: 0; background: transparent; outline: none; padding: 2px 0; font: 700 25px/1.2 var(--display); letter-spacing: -0.03em; }
.title-input::placeholder { color: var(--muted); opacity: .5; }
.w-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 16px; }
.date-pill { position: relative; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 999px; padding: 7px 14px 7px 12px; font-size: 14px; font-weight: 600; }
.date-pill .ico { width: 16px; height: 16px; color: var(--accent); }
.date-pill input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.meta-note { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.meta-note .ico { width: 16px; height: 16px; }
.progress { margin-bottom: 14px; }
.progress-bar { height: 8px; border-radius: 999px; background: var(--surface); overflow: hidden; }
.progress-bar i { display: block; height: 100%; background: var(--done); border-radius: inherit; transition: width .35s ease; }
.progress-l { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.notes-input { min-height: 44px; background: transparent; border-style: dashed; margin-bottom: 14px; }
.we { position: relative; background: var(--surface); border-radius: 20px; padding: 14px 14px 12px; margin-bottom: 12px; scroll-margin-top: 80px; }
.we::before { content: ""; position: absolute; left: 0; top: 20px; bottom: 20px; width: 4px; border-radius: 0 4px 4px 0; background: transparent; transition: background .2s; }
.we.done::before { background: var(--done); }
.we-head { display: flex; gap: 12px; align-items: flex-start; }
.we-head .icon-btn { margin: -4px -6px 0 0; }
.we-head .icon-btn:hover { background: var(--surface-2); }
.thumb {
  width: 52px; height: 52px; flex: none; border-radius: 14px; overflow: hidden; border: 0; padding: 0;
  display: grid; place-items: center; font: 700 19px var(--display); background: var(--surface-2);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.we-name { display: block; border: 0; background: none; padding: 0; text-align: left; font-weight: 700; font-size: 17px; line-height: 1.25; }
.we-sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.we-info { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.we-info:empty { display: none; }
.info-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 1.35; border-radius: 8px; padding: 4px 8px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.info-chip .ico { width: 13px; height: 13px; }
.info-chip.pr { background: var(--pr-soft); color: var(--pr-ink); font-weight: 600; }
.we-note { margin-top: 10px; font-size: 14px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); white-space: pre-wrap; }
.sets { display: grid; gap: 6px; margin: 14px 0 10px; }
.set-row { display: grid; grid-template-columns: 34px minmax(0, .85fr) minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 7px; align-items: center; }
.set-row.head { font-size: 12px; font-weight: 600; color: var(--muted); }
.set-row.head span { text-align: center; }
.set-n { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; justify-self: center; font: 600 13px var(--display); color: var(--muted); background: var(--surface-2); transition: background .2s, color .2s; }
.set-n .ico { width: 16px; height: 16px; }
.set-row.done .set-n { background: var(--done-soft); color: var(--done); }
.set-row.pr .set-n { background: var(--pr); color: #2B1B00; }
.plan { text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell {
  text-align: center; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums;
  padding: 6px 2px; min-height: 48px; background: var(--surface-2); border-color: transparent; border-radius: 12px;
}
.cell:focus { background: var(--surface); }
.cell::placeholder { color: var(--muted); opacity: .55; font-weight: 500; }
.set-row.done .cell { background: var(--done-soft); color: var(--done); }
.tick { display: grid; place-items: center; cursor: pointer; position: relative; }
.tick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tick span { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: background .15s, border-color .15s, transform .15s; }
.tick span::after { content: ""; width: 14px; height: 8px; border: solid transparent; border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); }
.tick input:checked + span { background: var(--done); border-color: var(--done); animation: pop .25s ease-out; }
.tick input:checked + span::after { border-color: var(--done-ink); }
.tick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
@keyframes pop { 50% { transform: scale(1.12); } }
.we-foot { display: flex; gap: 6px; }

/* ============ Таймер отдыха ============ */
.rest {
  position: fixed; left: 12px; right: 12px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 35;
  max-width: 520px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 20px;
  padding: 10px 10px 12px 18px; display: flex; align-items: center; gap: 8px; overflow: hidden;
  box-shadow: 0 12px 32px rgb(8 12 30 / .3); animation: rise .25s ease-out;
}
.rest-l { font-size: 12.5px; opacity: .72; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rest-time { font: 600 30px/1.1 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

const ic = (n, cls = '') => `<span class="ico ${cls}" aria-hidden="true">${ICONS[n] || ''}</span>`;

function installTouchIcon() {

    const c = document.createElement('canvas');
    c.width = c.height = 180;
    const g = c.getContext('2d');
    g.fillStyle = '#2A45F0'; g.fillRect(0, 0, 180, 180);

// ---------- Утилиты ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };

const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const WD_FULL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const WD_SHORT = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const mon3 = m => MONTHS_GEN[m].slice(0, 3);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtDate = s => { const d = parseYmd(s); return cap(`${WD_FULL[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`); };
const fmtDateWd = s => { const d = parseYmd(s); return `${WD_SHORT[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; };
const shortDate = s => { const d = parseYmd(s); return `${d.getDate()} ${mon3(d.getMonth())}`; };
function dayTitle(s) {
  const d = parseYmd(s), dm = `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
  if (s === today()) return `Сегодня, ${dm}`;
  if (s === addDays(today(), 1)) return `Завтра, ${dm}`;
  if (s === addDays(today(), -1)) return `Вчера, ${dm}`;

function mondayOf(s) { const d = parseYmd(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); }

  const m = Math.max(1, Math.round(ms / 60000));

  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b === 1) return one;
  if (b >= 2 && b <= 4) return few;

const e1rm = (w, r) => r <= 1 ? w : w * (1 + r / 30);
const r1 = x => Math.round(x * 10) / 10;
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;
function hueOf(s) { let h = 0; for (const ch of String(s || '')) h = (h * 31 + ch.codePointAt(0)) % 360; return h; }
const phStyle = e => `style="--h:${hueOf(e.muscle_group || e.name)}"`;
const initial = e => esc((e.name || '?').trim().charAt(0).toUpperCase() || '?');

  const m = (url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;

function setStr(s) {
  if (s.actual_reps == null) return null;
  return s.actual_weight != null ? `${fmtW(s.actual_weight)} × ${s.actual_reps}` : `${s.actual_reps} повт.`;

  const out = sets.filter(s => s.done).map(setStr).filter(Boolean);

}
async function fetchAll(build) {
  const size = 1000; let from = 0, out = [];
  for (;;) {
    const { data, error } = await build().range(from, from + size - 1);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < size) return out;
    from += size;
  }
}

function toast(msg, kind = '') {

}
function fail(err) {

  if (/schema cache|does not exist|Could not find the/i.test(msg)) msg += ' — выполните migration.sql в Supabase (см. README).';

function openModal(html, { onClose, cls = '' } = {}) {
  const root = $('#modal-root');
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `<div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  root.appendChild(wrap);
  document.body.classList.add('noscroll');
  let closed = false;
  const onKey = e => { if (e.key === 'Escape' && root.lastElementChild === wrap) close(); };
  function close(silent) {
    if (closed) return;
    closed = true;
    wrap.remove();
    document.removeEventListener('keydown', onKey);
    if (!root.children.length) document.body.classList.remove('noscroll');
    if (!silent) onClose?.();
  }
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  $$('[data-close]', wrap).forEach(b => b.addEventListener('click', () => close()));
  document.addEventListener('keydown', onKey);
  const auto = $('[autofocus]', wrap);
  if (auto && matchMedia('(pointer: fine)').matches) setTimeout(() => auto.focus(), 50);
  return { el: wrap.firstElementChild, close };
}
function closeAllModals() { $$('#modal-root .overlay').forEach(o => o.remove()); document.body.classList.remove('noscroll'); }

// История выполненных подходов по упражнениям (для «прошлого раза» и рекордов)
async function loadExerciseHistory(exIds, { before } = {}) {
  if (!exIds.length) return {};
  let rows;
  try {
    rows = await fetchAll(() => {
      let q = sb.from('workout_exercises')
        .select('id, exercise_id, workout_id, workouts!inner(date), sets(set_number, actual_reps, actual_weight, done)')
        .in('exercise_id', exIds).order('id');
      if (before) q = q.lt('workouts.date', before);
      return q;
    });
  } catch (e) { fail(e); return {}; }
  const res = {};
  for (const r of rows) {
    const sets = r.sets.filter(s => s.done && s.actual_reps != null).sort((a, b) => a.set_number - b.set_number);
    if (!sets.length) continue;
    const date = r.workouts.date;
    const h = (res[r.exercise_id] ||= { last: null, bestW: null, bestReps: null, bestE1rm: null, dates: new Set() });
    h.dates.add(date);
    if (!h.last || h.last.date < date) h.last = { date, sets };
    for (const s of sets) {
      if (s.actual_weight != null) {
        const w = Number(s.actual_weight);
        if (!h.bestW || w > h.bestW.w) h.bestW = { w, reps: s.actual_reps, date };
        const e = e1rm(w, s.actual_reps);
        if (h.bestE1rm == null || e > h.bestE1rm) h.bestE1rm = e;
      } else if (!h.bestReps || s.actual_reps > h.bestReps.reps) {
        h.bestReps = { reps: s.actual_reps, date };
      }
    }
  }
  for (const h of Object.values(res)) h.count = h.dates.size;
  return res;
}

async function compressImage(file, max = 1400) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return (await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82))) || file;
  } catch { return file; }
}
async function uploadMedia(blob, fallbackName) {
  const ext = blob.type === 'image/jpeg' ? 'jpg' : ((fallbackName || '').split('.').pop() || 'bin').toLowerCase();
  const path = `${state.user.id}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || undefined, cacheControl: '31536000' });
  if (error) throw error;
  return path;
}

    const src = photoFile ? URL.createObjectURL(photoFile) : (!removePhoto && e.photo_path ? mediaUrl(e.photo_path) : null);
    $('#photo-prev', el).innerHTML = src ? `<img src="${esc(src)}" alt="">` : `${ic('camera')}<span>Сфотографировать или выбрать</span>`;
    $('#photo-rm', el).hidden = !src;
  };
  const drawVideo = () => {
    const src = videoFile ? URL.createObjectURL(videoFile) : (!removeVideo && e.video_path ? mediaUrl(e.video_path) : null);
    $('#video-prev', el).innerHTML = src ? `<video src="${esc(src)}" muted playsinline preload="metadata"></video><span class="hint">Нажмите, чтобы заменить</span>` : `${ic('video')}<span>Загрузить видео</span>`;
    $('#video-rm', el).hidden = !src;
  };
  drawPhoto(); drawVideo();
  $('#photo-in', el).onchange = ev => { photoFile = ev.target.files[0] || null; removePhoto = false; drawPhoto(); };
  $('#photo-rm', el).onclick = () => { photoFile = null; removePhoto = true; $('#photo-in', el).value = ''; drawPhoto(); };
  $('#video-in', el).onchange = ev => {
    const f = ev.target.files[0] || null;
    if (f && f.size > MAX_VIDEO_MB * 1024 * 1024) { toast(`Видео больше ${MAX_VIDEO_MB} МБ — сожмите его или вставьте ссылку`, 'err'); ev.target.value = ''; return; }
    videoFile = f; removeVideo = false; drawVideo();
  };
  $('#video-rm', el).onclick = () => { videoFile = null; removeVideo = true; $('#video-in', el).value = ''; drawVideo(); };

  $('#ex-form', el).onsubmit = async ev => {
    ev.preventDefault();
    const btn = $('#ex-save', el);
    btn.disabled = true; btn.textContent = 'Сохраняю…';
    try {
      const fd = new FormData(ev.target);
      const rest = num(fd.get('rest'));
      if (rest != null && (Number.isNaN(rest) || rest < 0)) throw new Error('Отдых укажите числом секунд');
      const row = {
        name: fd.get('name').trim(),
        muscle_group: fd.get('muscle_group').trim() || null,
        equipment: fd.get('equipment').trim() || null,
        notes: fd.get('notes').trim() || null,
        video_url: fd.get('video_url').trim() || null,
      };
      // колонка rest_seconds появляется после migration.sql — не трогаем её, если её нет
      if (rest != null || state.exercises.some(x => 'rest_seconds' in x)) row.rest_seconds = rest == null ? null : Math.round(rest);
      const toDelete = [];
      if (photoFile) {
        row.photo_path = await uploadMedia(await compressImage(photoFile), photoFile.name);
        if (e.photo_path) toDelete.push(e.photo_path);
      } else if (removePhoto) { row.photo_path = null; if (e.photo_path) toDelete.push(e.photo_path); }
      if (videoFile) {
        row.video_path = await uploadMedia(videoFile, videoFile.name);
        if (e.video_path) toDelete.push(e.video_path);
      } else if (removeVideo) { row.video_path = null; if (e.video_path) toDelete.push(e.video_path); }
      const { data, error } = await (id
        ? sb.from('exercises').update(row).eq('id', id).select().single()
        : sb.from('exercises').insert(row).select().single());
      if (error) throw error;
      if (toDelete.length) sb.storage.from(BUCKET).remove(toDelete);
      await loadExercises();
      m.close(true);
      toast(id ? 'Изменения сохранены' : 'Упражнение добавлено', 'ok');
      if (onSaved) onSaved(data); else renderView();
    } catch (err) {
      fail(err);
      btn.disabled = false; btn.textContent = 'Сохранить';
    }
  };

  const del = $('#ex-del', el);
  if (del) del.onclick = async () => {
    if (!await confirmDialog({ title: `Удалить «${e.name}»?`, text: 'Фото и видео тоже удалятся.' })) return;
    const { error } = await sb.from('exercises').delete().eq('id', id);
    if (error) {
      if (error.code !== '23503') return fail(error);
      const ok = await confirmDialog({ title: 'Упражнение есть в тренировках', text: 'Его можно скрыть из библиотеки — история и прогресс сохранятся.', ok: 'Скрыть', danger: false });
      if (!ok) return;
      const r = await sb.from('exercises').update({ archived: true }).eq('id', id);
      if (r.error) return fail(r.error);
      toast('Упражнение скрыто из библиотеки');
    } else {
      const files = [e.photo_path, e.video_path].filter(Boolean);
      if (files.length) sb.storage.from(BUCKET).remove(files);
      toast('Упражнение удалено');
    }
    await loadExercises();
    m.close(true);
    renderView();
  };
}
