<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E9EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131826" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Тренировки</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root {
  --bg: #E6E9EE;
  --surface: #FFFFFF;
  --surface-2: #F1F3F6;
  --ink: #151C2C;
  --muted: #5E6778;
  --line: #D3D8E0;
  --accent: #2447F5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E8FF;
  --done: #0E8A5F;
  --done-soft: #DDF3EA;
  --danger: #C62B3B;
  --radius-lg: 18px;
  --radius: 12px;
  --radius-sm: 8px;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131826; --surface: #1C2233; --surface-2: #242B3E; --ink: #E8ECF4; --muted: #98A1B3;
    --line: #2F3850; --accent: #7088FF; --accent-ink: #0E1220; --accent-soft: #252F55;
    --done: #3CC98E; --done-soft: #1B3A31; --danger: #FF6B7A;
  }
}
:root[data-theme="dark"] {
  --bg: #131826; --surface: #1C2233; --surface-2: #242B3E; --ink: #E8ECF4; --muted: #98A1B3;
  --line: #2F3850; --accent: #7088FF; --accent-ink: #0E1220; --accent-soft: #252F55;
  --done: #3CC98E; --done-soft: #1B3A31; --danger: #FF6B7A;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
img, video { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.grow { flex: 1; }
.row { display: flex; align-items: center; }
.gap { gap: 8px; }
.mt { margin-top: 16px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- top & tab bars ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.topbar-in { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.topbar h1 { flex: 1; margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
main.wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center; gap: 4px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.tabbar button {
  flex: 1; max-width: 200px; border: 0; background: none; padding: 10px 8px; border-radius: var(--radius);
  font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer;
}
.tabbar button.active { background: var(--accent-soft); color: var(--accent); }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.block { display: flex; width: 100%; }
.icon-btn {
  width: 40px; height: 40px; flex: none; display: inline-grid; place-items: center;
  border: 0; border-radius: 50%; background: transparent; cursor: pointer; font-size: 20px; color: var(--muted);
}
.icon-btn:disabled { opacity: .3; }
.icon-btn:not(:disabled):hover { background: var(--surface-2); color: var(--ink); }
.input {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface); outline: none;
}
.input:focus { border-color: var(--accent); }
textarea.input { resize: vertical; }
.form { display: grid; gap: 14px; }
.form label, .field { display: grid; gap: 6px; font-size: 14px; font-weight: 500; color: var(--muted); }
.form label .input, .field .input { color: var(--ink); font-size: 16px; font-weight: 400; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 14px; font-size: 14px; cursor: pointer;
}
.chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card { background: var(--surface); border-radius: var(--radius-lg); padding: 16px; }
.list { display: grid; gap: 8px; margin-top: 12px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }

/* ---------- exercise cards ---------- */
.ex-card {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 0; border-radius: var(--radius); padding: 8px; cursor: pointer;
}
.ex-card:hover { background: var(--surface-2); }
.thumb {
  width: 56px; height: 56px; flex: none; border-radius: var(--radius-sm); overflow: hidden;
  background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
  font-weight: 800; font-size: 22px; border: 0; padding: 0; cursor: pointer;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.ex-meta { flex: 1; min-width: 0; }
.ex-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 9px; font-weight: 600; }

/* ---------- calendar ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
.cal-title { font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
.day {
  aspect-ratio: 1 / 1; border: 0; border-radius: var(--radius-sm); background: var(--surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  cursor: pointer; font-variant-numeric: tabular-nums; font-weight: 500; position: relative;
}
.day.today { box-shadow: inset 0 0 0 2px var(--ink); }
.day.sel { background: var(--accent); color: var(--accent-ink); }
.dots { display: flex; gap: 3px; height: 6px; }
.dots b { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.dots b.ok { background: var(--done); }
.day.sel .dots b { background: var(--accent-ink); }
.section-title { font-size: 20px; font-weight: 800; margin: 28px 0 10px; letter-spacing: -0.01em; }
.section-title:first-letter { text-transform: uppercase; }
.w-item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0;
  background: var(--surface); border-radius: var(--radius); padding: 14px 16px; cursor: pointer;
}
.w-item:hover { background: var(--surface-2); }
.w-item .w-title { font-weight: 600; }
.status { font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.status.ok { background: var(--done-soft); color: var(--done); }
.status.plan { background: var(--accent-soft); color: var(--accent); }

/* ---------- workout ---------- */
.back { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 0; cursor: pointer; font-size: 15px; }
.title-input {
  width: 100%; border: 0; background: transparent; outline: none; padding: 4px 0;
  font-size: 26px; font-weight: 800; letter-spacing: -0.02em;
}
.title-input::placeholder { color: var(--muted); opacity: .6; }
.w-head { display: grid; gap: 12px; margin: 8px 0 16px; }
.w-head .row { flex-wrap: wrap; }
.w-head input[type="date"] { width: auto; }
.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--done); }
.we { margin-bottom: 12px; border-left: 4px solid transparent; transition: border-color .2s; }
.we.done { border-left-color: var(--done); }
.we-head { display: flex; gap: 12px; align-items: flex-start; }
.we-name { border: 0; background: none; padding: 0; font-weight: 700; font-size: 18px; text-align: left; cursor: pointer; }
.prev-line { font-size: 13px; color: var(--muted); margin-top: 4px; }
.we-tools { display: flex; margin: -6px -8px 0 0; }
.we-tools .icon-btn { width: 34px; height: 34px; font-size: 16px; }
.we-note { margin-top: 10px; font-size: 14px; }
.sets { display: grid; gap: 6px; margin: 14px 0 10px; }
.set-row { display: grid; grid-template-columns: 28px 1fr 1fr 1fr 52px; gap: 8px; align-items: center; }
.set-row.head { font-size: 12px; color: var(--muted); }
.set-row.head span:not(:first-child) { text-align: center; }
.set-row .n { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); text-align: center; }
.set-row .plan { text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell {
  text-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums;
  padding: 6px 4px; min-height: 48px; background: var(--surface-2); border-color: transparent;
}
.cell::placeholder { color: var(--muted); opacity: .55; font-weight: 400; }
.set-row.done .cell { background: var(--done-soft); color: var(--done); }
.tick { display: grid; place-items: center; cursor: pointer; }
.tick input { position: absolute; opacity: 0; pointer-events: none; }
.tick span {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center;
  transition: background .15s, border-color .15s, transform .15s;
}
.tick span::after { content: ""; width: 14px; height: 8px; border: solid transparent; border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); }
.tick input:checked + span { background: var(--done); border-color: var(--done); transform: scale(1.04); }
.tick input:checked + span::after { border-color: #fff; }
.tick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- modal ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: rgb(10 14 25 / .45);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--bg);
  border-radius: 22px 22px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  animation: rise .22s ease-out;
}
@media (min-width: 640px) {
  .overlay { align-items: center; }
  .sheet { border-radius: 22px; max-height: 86vh; }
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .tick span, .we { transition: none; } }
.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.sheet-head h2 { flex: 1; margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.media { width: 100%; border-radius: var(--radius); margin-top: 12px; background: #000; }
.video-wrap { position: relative; aspect-ratio: 16 / 9; margin-top: 12px; border-radius: var(--radius); overflow: hidden; }
.video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.notes { white-space: pre-wrap; margin: 14px 0 0; }
.prev img, .prev video { max-height: 220px; border-radius: var(--radius-sm); margin-bottom: 8px; }
.file { position: relative; }
.pick-item.sel { outline: 2px solid var(--accent); }

/* ---------- progress ---------- */
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
.metric { background: var(--surface); border-radius: var(--radius); padding: 12px; }
.metric .v { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.metric .l { font-size: 13px; color: var(--muted); }
.chart-box { position: relative; height: 240px; }
.hist { display: grid; gap: 6px; margin-top: 12px; }
.hist-row { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; }
.hist-row .d { font-weight: 600; }
.hist-row .s { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- auth / toast ---------- */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.auth .card { width: 100%; max-width: 380px; }
.auth h1 { margin: 0 0 4px; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
#toast {
  position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translateX(-50%); max-width: calc(100% - 32px);
}
#toast div {
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--radius);
  font-size: 15px; font-weight: 500; margin-top: 6px; text-align: center;
}
#toast div.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   НАСТРОЙКИ — вставьте данные своего проекта Supabase
   (Project Settings → API: Project URL и anon / publishable key)
   ===================================================================== */
const SUPABASE_URL = 'aitlnderekzxyhedpard.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UEiEYVXUHFRY-F7neAP8PA_VDtMx0Bb';
const BUCKET = 'media';
const MAX_VIDEO_MB = 50;

/* ===================================================================== */
const configured = !SUPABASE_URL.includes('ВАШ') && !SUPABASE_KEY.includes('ВАШ');
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const WD_FULL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const fmtDate = s => { const d = parseYmd(s); return `${WD_FULL[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; };
const shortDate = s => { const d = parseYmd(s); return `${d.getDate()} ${MONTHS_GEN[d.getMonth()].slice(0, 3)}`; };
const num = v => (v === '' || v == null) ? null : Number(String(v).replace(',', '.').trim());
const fmtW = w => w == null ? '' : String(+(+w).toFixed(2));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;
const today = () => ymd(new Date());

function toast(msg, isErr = false) {
  const t = document.createElement('div');
  t.textContent = msg;
  if (isErr) t.className = 'err';
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), isErr ? 4500 : 2200);
}
function fail(err) {
  console.error(err);
  toast(err?.message || 'Не удалось выполнить действие', true);
}
function mediaUrl(path) {
  return path ? sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl : null;
}
function youtubeId(url) {
  const m = (url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
function thumbHtml(e, attrs = '') {
  const p = mediaUrl(e.photo_path);
  return `<button class="thumb" ${attrs} aria-label="${esc(e.name)}">${p ? `<img src="${esc(p)}" loading="lazy" alt="">` : esc((e.name || '?').trim()[0]?.toUpperCase() || '?')}</button>`;
}
function setStr(s) {
  const w = s.actual_weight, r = s.actual_reps;
  if (r == null) return null;
  return w != null ? `${fmtW(w)} × ${r}` : `${r} повт.`;
}
function setsSummary(sets) {
  const done = sets.filter(s => s.done).map(setStr).filter(Boolean);
  return done.length ? done.join(', ') : 'нет отмеченных подходов';
}

// ---------- state ----------
const now = new Date();
const state = {
  user: null,
  tab: 'calendar',
  exercises: [],
  month: new Date(now.getFullYear(), now.getMonth(), 1),
  selDate: today(),
  monthWorkouts: [],
  workoutId: null,
  w: null,
  prev: {},
  progressExId: null,
  exFilter: '',
  exGroup: '',
  chart: null,
  metric: null,
};
const exById = id => state.exercises.find(e => e.id === id);
const activeExercises = () => state.exercises.filter(e => !e.archived);
const groups = () => [...new Set(activeExercises().map(e => e.muscle_group).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));

// ---------- modal ----------
function openModal(html) {
  const root = $('#modal-root');
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  root.appendChild(wrap);
  document.body.classList.add('noscroll');
  const close = () => {
    wrap.remove();
    if (!root.children.length) document.body.classList.remove('noscroll');
  };
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
  $$('[data-close]', wrap).forEach(b => b.onclick = close);
  const onKey = e => { if (e.key === 'Escape' && wrap.isConnected) { close(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
  return { el: wrap.firstElementChild, close };
}

// ---------- boot / auth ----------
async function boot() {
  if (!configured) return renderNotConfigured();
  const { data: { session } } = await sb.auth.getSession();
  state.user = session?.user ?? null;
  sb.auth.onAuthStateChange((_event, s) => {
    const was = state.user?.id;
    state.user = s?.user ?? null;
    if (was !== state.user?.id) setTimeout(start, 0);
  });
  start();
}

async function start() {
  if (!state.user) return renderLogin();
  renderShell();
  $('#view').innerHTML = '<div class="loading">Загрузка…</div>';
  await loadExercises();
  renderView();
}

function renderNotConfigured() {
  $('#app').innerHTML = `
    <div class="auth"><div class="card">
      <h1>Почти готово</h1>
      <p class="muted">Откройте <b>index.html</b> и впишите в начало скрипта <b>SUPABASE_URL</b> и <b>SUPABASE_KEY</b> своего проекта. Подробности в README.</p>
    </div></div>`;
}

function renderLogin() {
  $('#app').innerHTML = `
    <div class="auth"><div class="card">
      <h1>Тренировки</h1>
      <p class="muted" style="margin:0 0 18px">Войдите, чтобы открыть свой план.</p>
      <form class="form" id="login">
        <label>Email<input class="input" type="email" name="email" autocomplete="email" required></label>
        <label>Пароль<input class="input" type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn primary block" type="submit">Войти</button>
      </form>
    </div></div>`;
  $('#login').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const btn = $('button[type=submit]', ev.target);
    btn.disabled = true;

async function compressImage(file, max = 1400) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  } catch { return file; }
}

async function uploadMedia(blob, fallbackName) {
  const ext = blob.type === 'image/jpeg' ? 'jpg' : ((fallbackName || '').split('.').pop() || 'bin').toLowerCase();
  const path = `${state.user.id}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || undefined, cacheControl: '31536000' });
  if (error) throw error;
  return path;
}

function openExerciseForm(id, onSaved) {
  const e = id ? exById(id) : {};
  let photoFile = null, videoFile = null, removePhoto = false, removeVideo = false;
  const m = openModal(`
    <div class="sheet-head"><h2>${id ? 'Изменить упражнение' : 'Новое упражнение'}</h2><button class="icon-btn" data-close aria-label="Закрыть">✕</button></div>
    <form class="form" id="ex-form">
      <label>Название<input class="input" name="name" required value="${esc(e.name)}" placeholder="Жим ногами"></label>
      <label>Группа мышц<input class="input" name="muscle_group" list="groups-dl" value="${esc(e.muscle_group)}" placeholder="Ноги"></label>
      <datalist id="groups-dl">${groups().map(g => `<option value="${esc(g)}">`).join('')}</datalist>
      <label>Тренажёр и где он стоит<input class="input" name="equipment" value="${esc(e.equipment)}" placeholder="Платформа 45°, второй зал у окна"></label>
      <label>Техника и заметки<textarea class="input" name="notes" rows="3" placeholder="Спина прижата, колени не сводить">${esc(e.notes)}</textarea></label>
      <div class="field">Фото тренажёра
        <div class="prev" id="photo-prev"></div>
        <div class="row gap">
          <label class="btn sm file">Выбрать фото<input type="file" accept="image/*" id="photo-in" hidden></label>
          <button type="button" class="btn sm ghost danger" id="photo-rm">Убрать фото</button>
        </div>
      </div>
      <div class="field">Видео с техникой
        <input class="input" name="video_url" value="${esc(e.video_url)}" placeholder="Ссылка на YouTube или другое видео">
        <div class="prev" id="video-prev"></div>
        <div class="row gap">
          <label class="btn sm file">Загрузить своё видео<input type="file" accept="video/*" id="video-in" hidden></label>
          <button type="button" class="btn sm ghost danger" id="video-rm">Убрать видео</button>
        </div>
        <span class="small muted" style="font-weight:400">Файл до ${MAX_VIDEO_MB} МБ. Для длинных роликов удобнее ссылка.</span>
      </div>
      <div class="row gap mt">
        ${id ? '<button type="button" class="btn ghost danger" id="ex-del">Удалить</button>' : ''}
        <span class="grow"></span>
        <button class="btn primary" type="submit" id="ex-save">Сохранить</button>
      </div>
    </form>`);
  const el = m.el;
  const drawPhoto = () => {
    const src = photoFile ? URL.createObjectURL(photoFile) : (!removePhoto && e.photo_path ? mediaUrl(e.photo_path) : null);
    $('#photo-prev', el).innerHTML = src ? `<img src="${esc(src)}" alt="">` : '';
    $('#photo-rm', el).hidden = !src;
  };
  const drawVideo = () => {
    const src = videoFile ? URL.createObjectURL(videoFile) : (!removeVideo && e.video_path ? mediaUrl(e.video_path) : null);
    $('#video-prev', el).innerHTML = src ? `<video src="${esc(src)}" controls playsinline preload="metadata"></video>` : '';
    $('#video-rm', el).hidden = !src;
  };
  drawPhoto(); drawVideo();
  $('#photo-in', el).onchange = ev => { photoFile = ev.target.files[0] || null; removePhoto = false; drawPhoto(); };
  $('#photo-rm', el).onclick = () => { photoFile = null; removePhoto = true; $('#photo-in', el).value = ''; drawPhoto(); };
  $('#video-in', el).onchange = ev => {
    const f = ev.target.files[0] || null;
    if (f && f.size > MAX_VIDEO_MB * 1024 * 1024) { toast(`Видео больше ${MAX_VIDEO_MB} МБ — сожмите его или вставьте ссылку`, true); ev.target.value = ''; return; }
    videoFile = f; removeVideo = false; drawVideo();
  };
  $('#video-rm', el).onclick = () => { videoFile = null; removeVideo = true; $('#video-in', el).value = ''; drawVideo(); };

  $('#ex-form', el).onsubmit = async ev => {
    ev.preventDefault();
    const btn = $('#ex-save', el);

        notes: fd.get('notes').trim() || null,

        row.photo_path = null;

      if (onSaved) onSaved(data); else renderView();

      if (error.code === '23503') {

        if (r.error) return fail(r.error);

      } else return fail(error);
    } else {
      const files = [e.photo_path, e.video_path].filter(Boolean);
      if (files.length) sb.storage.from(BUCKET).remove(files);
      toast('Упражнение удалено');
    }
    await loadExercises();
    m.close();
    renderView();
  };
}

async function loadMonth() {
  const y = state.month.getFullYear(), mo = state.month.getMonth();
  const from = ymd(new Date(y, mo, 1)), to = ymd(new Date(y, mo + 1, 0));
  const { data, error } = await sb.from('workouts')
    .select('id, date, title, completed, workout_exercises(count)')
    .gte('date', from).lte('date', to).order('created_at');
  if (error) { fail(error); return false; }
  state.monthWorkouts = data;
  return true;
}

async function renderCalendar() {
  setHeader('План', `<button class="btn sm" id="go-today">Сегодня</button>`);
  $('#go-today').onclick = () => {
    const d = new Date();
    state.month = new Date(d.getFullYear(), d.getMonth(), 1);
    state.selDate = today();
    renderCalendar();
  };
  const v = $('#view');
  if (!v.querySelector('.cal-grid')) v.innerHTML = '<div class="loading">Загрузка…</div>';
  const [ok, upcoming] = await Promise.all([
    loadMonth(),
    sb.from('workouts').select('id, date, title, completed').gte('date', today()).eq('completed', false).order('date').limit(5),
  ]);
  if (state.tab !== 'calendar' || state.workoutId || !ok) return;
  drawCalendar(upcoming.data || []);
}

function drawCalendar(upcoming) {
  const v = $('#view');
  const y = state.month.getFullYear(), mo = state.month.getMonth();
  const offset = (new Date(y, mo, 1).getDay() + 6) % 7;
  const days = new Date(y, mo + 1, 0).getDate();
  const byDate = {};
  state.monthWorkouts.forEach(w => (byDate[w.date] ||= []).push(w));
  const t = today();
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad(mo + 1)}-${pad(d)}`;
    const ws = byDate[ds] || [];
    cells += `<button class="day ${ds === state.selDate ? 'sel' : ''} ${ds === t ? 'today' : ''}" data-date="${ds}" aria-label="${d} ${MONTHS_GEN[mo]}${ws.length ? ', тренировок: ' + ws.length : ''}">
      <span>${d}</span><i class="dots">${ws.slice(0, 3).map(w => `<b class="${w.completed ? 'ok' : ''}"></b>`).join('')}</i></button>`;
  }
  const dayWs = byDate[state.selDate] || [];
  const itemHtml = (w, showDate) => {
    const cnt = w.workout_exercises?.[0]?.count;
    return `<button class="w-item" data-w="${w.id}">
      <span class="grow"><span class="w-title" style="display:block">${esc(w.title || 'Тренировка')}</span>
      <span class="muted small">${showDate ? esc(fmtDate(w.date)) : (cnt ? `упражнений: ${cnt}` : 'упражнения не добавлены')}</span></span>
      <span class="status ${w.completed ? 'ok' : 'plan'}">${w.completed ? 'выполнена' : 'в плане'}</span></button>`;
  };
  const upcomingOther = upcoming.filter(w => w.date !== state.selDate);
  v.innerHTML = `
    <div class="cal-head">
      <button class="icon-btn" id="m-prev" aria-label="Предыдущий месяц">‹</button>
      <div class="cal-title">${MONTHS[mo]} ${y}</div>
      <button class="icon-btn" id="m-next" aria-label="Следующий месяц">›</button>
    </div>
    <div class="cal-grid">${WD.map(d => `<div class="wd">${d}</div>`).join('')}${cells}</div>
    <h2 class="section-title">${esc(fmtDate(state.selDate))}</h2>
    <div class="list">${dayWs.map(w => itemHtml(w, false)).join('')}</div>
    <button class="btn ${dayWs.length ? '' : 'primary'} block mt" id="new-w">Запланировать тренировку</button>
    ${upcomingOther.length ? `<h2 class="section-title">Ближайшие</h2><div class="list">${upcomingOther.map(w => itemHtml(w, true)).join('')}</div>` : ''}`;
  const shiftMonth = n => {
    state.month = new Date(y, mo + n, 1);
    const tm = new Date();
    state.selDate = (state.month.getFullYear() === tm.getFullYear() && state.month.getMonth() === tm.getMonth()) ? today() : ymd(state.month);
    renderCalendar();
  };
  $('#m-prev').onclick = () => shiftMonth(-1);
  $('#m-next').onclick = () => shiftMonth(1);
  $('#new-w').onclick = () => openNewWorkout();
  v.onclick = ev => {
    const d = ev.target.closest('.day');
    if (d) { state.selDate = d.dataset.date; drawCalendar(upcoming); return; }
    const w = ev.target.closest('[data-w]');
    if (w) { state.workoutId = w.dataset.w; renderView(); window.scrollTo(0, 0); }
  };
}

    <form class="form" id="nw-form">

async function loadWorkout(id) {
  const { data, error } = await sb.from('workouts')
    .select('*, workout_exercises(id, exercise_id, position, notes, sets(*))')
    .eq('id', id).maybeSingle();
  if (error) { fail(error); return null; }
  if (!data) return null;
  data.workout_exercises.sort((a, b) => a.position - b.position);
  data.workout_exercises.forEach(we => we.sets.sort((a, b) => a.set_number - b.set_number));
  return data;
}

// Последняя тренировка ДО указанной даты для каждого упражнения
async function loadPrevious(exIds, beforeDate) {
  if (!exIds.length) return {};
  const { data, error } = await sb.from('workout_exercises')
    .select('exercise_id, workouts!inner(date), sets(set_number, actual_reps, actual_weight, planned_reps, planned_weight, done)')
    .in('exercise_id', exIds).lt('workouts.date', beforeDate);
  if (error) { fail(error); return {}; }
  const res = {};
  for (const r of data) {
    const date = r.workouts.date;
    const sets = r.sets.sort((a, b) => a.set_number - b.set_number);
    if (!sets.some(s => s.done)) continue;
    if (!res[r.exercise_id] || res[r.exercise_id].date < date) res[r.exercise_id] = { date, sets };
  }
  return res;
}

async function renderWorkout() {
  setHeader('Тренировка');
  const v = $('#view');
  v.innerHTML = '<div class="loading">Загрузка…</div>';
  const w = await loadWorkout(state.workoutId);
  if (!w) { state.workoutId = null; toast('Тренировка не найдена', true); return renderCalendar(); }
  if (state.tab !== 'calendar' || state.workoutId !== w.id) return;
  state.w = w;
  state.prev = await loadPrevious([...new Set(w.workout_exercises.map(x => x.exercise_id))], w.date);
  drawWorkout();
}

function planStr(s) {
  if (s.planned_reps == null && s.planned_weight == null) return '—';
  if (s.planned_weight == null) return `${s.planned_reps}`;
  return `${fmtW(s.planned_weight)}×${s.planned_reps ?? '?'}`;
}

    <div class="we-head">
      ${thumbHtml(e, `data-view-ex="${e.id || ''}"`)}
      <div class="grow" style="min-width:0">
        <button class="we-name" data-view-ex="${e.id || ''}">${esc(e.name)}</button>
        ${e.equipment ? `<div class="muted small">${esc(e.equipment)}</div>` : ''}
        ${prev ? `<div class="prev-line num">Прошлый раз, ${esc(shortDate(prev.date))}: ${esc(setsSummary(prev.sets))}</div>` : ''}
      </div>
      <div class="we-tools">
        <button class="icon-btn" data-move="-1" ${i === 0 ? 'disabled' : ''} aria-label="Выше">↑</button>
        <button class="icon-btn" data-move="1" ${i === len - 1 ? 'disabled' : ''} aria-label="Ниже">↓</button>
        <button class="icon-btn" data-rm-we aria-label="Убрать из тренировки">✕</button>
      </div>
    </div>
    <div class="sets">
      ${we.sets.length ? `<div class="set-row head"><span></span><span>План</span><span>Кг</span><span>Повт.</span><span></span></div>` : ''}
      ${we.sets.map(s => `<div class="set-row ${s.done ? 'done' : ''}" data-set="${s.id}">
        <span class="n">${s.set_number}</span>
        <span class="plan">${esc(planStr(s))}</span>
        <input class="input cell" inputmode="decimal" data-f="actual_weight" value="${fmtW(s.actual_weight)}" placeholder="${fmtW(s.planned_weight)}" aria-label="Вес, подход ${s.set_number}">
        <input class="input cell" inputmode="numeric" data-f="actual_reps" value="${s.actual_reps ?? ''}" placeholder="${s.planned_reps ?? ''}" aria-label="Повторения, подход ${s.set_number}">
        <label class="tick"><input type="checkbox" data-f="done" ${s.done ? 'checked' : ''} aria-label="Подход ${s.set_number} выполнен"><span></span></label>
      </div>`).join('')}
    </div>
    <div class="row gap">
      <button class="btn sm" data-add-set>Добавить подход</button>
      <button class="btn sm ghost" data-rm-set ${we.sets.length ? '' : 'disabled'}>Убрать последний</button>
    </div>
  </section>`;
}

function drawWorkout() {
  const w = state.w;
  const v = $('#view');
  const list = w.workout_exercises;
  v.innerHTML = `
    <button class="back" id="back">‹ К календарю</button>
    <div class="w-head">
      <input class="title-input" id="w-title" value="${esc(w.title)}" placeholder="Название тренировки" aria-label="Название тренировки">
      <div class="row gap">
        <input class="input" type="date" id="w-date" value="${w.date}" aria-label="Дата">
        <label class="check"><input type="checkbox" id="w-done" ${w.completed ? 'checked' : ''}> Тренировка выполнена</label>
      </div>
      <textarea class="input" id="w-notes" rows="2" placeholder="Заметки: самочувствие, что поменять в следующий раз">${esc(w.notes)}</textarea>
    </div>
    ${list.length ? list.map((we, i) => weHtml(we, i, list.length)).join('')
      : `<div class="empty"><strong>Упражнений пока нет</strong>Добавьте упражнения из библиотеки и задайте подходы, повторения и вес.</div>`}
    <button class="btn primary block" id="add-we">Добавить упражнение</button>
    <div class="row gap mt">
      <button class="btn grow" id="w-copy">Повторить в другой день</button>
      <button class="btn ghost danger" id="w-del">Удалить</button>
    </div>`;

  const saveW = async patch => {
    const { error } = await sb.from('workouts').update(patch).eq('id', w.id);
    if (error) return fail(error);
    Object.assign(w, patch);
  };
  $('#w-title').onchange = e => saveW({ title: e.target.value.trim() || null });
  $('#w-notes').onchange = e => saveW({ notes: e.target.value.trim() || null });
  $('#w-done').onchange = e => { saveW({ completed: e.target.checked }); if (e.target.checked) toast('Отличная работа'); };
  $('#w-date').onchange = async e => {
    if (!e.target.value) return;
    await saveW({ date: e.target.value });
    state.selDate = w.date;
    const d = parseYmd(w.date); state.month = new Date(d.getFullYear(), d.getMonth(), 1);
    state.prev = await loadPrevious([...new Set(list.map(x => x.exercise_id))], w.date);
    drawWorkout();
  };

  v.onchange = async ev => {
    const inp = ev.target.closest('[data-f]');
    const row = inp?.closest('[data-set]');
    if (!row) return;
    const we = list.find(x => x.id === row.closest('[data-we]').dataset.we);
    const s = we.sets.find(x => x.id === row.dataset.set);
    const f = inp.dataset.f;
    const patch = {};
    if (f === 'done') {
      patch.done = inp.checked;
      if (inp.checked) {
        if (s.actual_weight == null && s.planned_weight != null) patch.actual_weight = s.planned_weight;
        if (s.actual_reps == null && s.planned_reps != null) patch.actual_reps = s.planned_reps;
      }
    } else {
      const val = num(inp.value);
      if (val != null && (Number.isNaN(val) || val < 0)) { toast('Введите число', true); inp.value = f === 'actual_weight' ? fmtW(s[f]) : (s[f] ?? ''); return; }
      patch[f] = (f === 'actual_reps' && val != null) ? Math.round(val) : val;
    }
    const { error } = await sb.from('sets').update(patch).eq('id', s.id);
    if (error) { if (f === 'done') inp.checked = !inp.checked; return fail(error); }
    Object.assign(s, patch);
    row.classList.toggle('done', s.done);
    $('[data-f="actual_weight"]', row).value = fmtW(s.actual_weight);
    $('[data-f="actual_reps"]', row).value = s.actual_reps ?? '';
    const card = row.closest('.we');
    card.classList.toggle('done', we.sets.length > 0 && we.sets.every(x => x.done));
  };

  v.onclick = async ev => {
    const t = ev.target;
    if (t.closest('#back')) { state.workoutId = null; return renderView(); }
    if (t.closest('#add-we')) return openAddExercise();
    if (t.closest('#w-copy')) return openCopyWorkout();
    if (t.closest('#w-del')) {
      if (!confirm('Удалить тренировку вместе с подходами?')) return;
      const { error } = await sb.from('workouts').delete().eq('id', w.id);
      if (error) return fail(error);
      toast('Тренировка удалена');
      state.workoutId = null;
      return renderView();
    }
    const viewEx = t.closest('[data-view-ex]');
    if (viewEx && viewEx.dataset.viewEx) return openExerciseView(viewEx.dataset.viewEx);

    const card = t.closest('[data-we]');
    if (!card) return;
    const idx = list.findIndex(x => x.id === card.dataset.we);
    const we = list[idx];

    const mv = t.closest('[data-move]');
    if (mv) {
      const j = idx + Number(mv.dataset.move);
      const other = list[j];
      if (!other) return;
      // нормализуем позиции по текущему порядку, затем меняем местами
      list.forEach((x, k) => x.position = k);
      [we.position, other.position] = [other.position, we.position];
      const [a, b] = await Promise.all([
        sb.from('workout_exercises').update({ position: we.position }).eq('id', we.id),
        sb.from('workout_exercises').update({ position: other.position }).eq('id', other.id),
      ]);
      if (a.error || b.error) return fail(a.error || b.error);
      list.sort((x, y) => x.position - y.position);
      return drawWorkout();
    }
    if (t.closest('[data-rm-we]')) {
      const name = exById(we.exercise_id)?.name || 'упражнение';
      if (!confirm(`Убрать «${name}» из тренировки?`)) return;
      const { error } = await sb.from('workout_exercises').delete().eq('id', we.id);
      if (error) return fail(error);
      list.splice(idx, 1);
      return drawWorkout();
    }
    if (t.closest('[data-add-set]')) {
      const last = we.sets[we.sets.length - 1];
      const { data, error } = await sb.from('sets').insert({
        workout_exercise_id: we.id,
        set_number: (last?.set_number || 0) + 1,
        planned_reps: last?.planned_reps ?? null,
        planned_weight: last?.planned_weight ?? null,
      }).select().single();
      if (error) return fail(error);
      we.sets.push(data);
      return drawWorkout();
    }
    if (t.closest('[data-rm-set]')) {
      const last = we.sets[we.sets.length - 1];
      if (!last) return;
      const { error } = await sb.from('sets').delete().eq('id', last.id);
      if (error) return fail(error);
      we.sets.pop();
      return drawWorkout();
    }
  };
}

function openAddExercise() {
  const w = state.w;
  let chosen = null, q = '';
  const m = openModal(`
    <div class="sheet-head"><h2>Добавить упражнение</h2><button class="icon-btn" data-close aria-label="Закрыть">✕</button></div>
    <div id="pk-pick">
      <input class="input" id="pk-search" type="search" placeholder="Название или тренажёр">
      <div class="list" id="pk-list"></div>
      <button class="btn block mt" id="pk-new">Создать новое упражнение</button>
    </div>
    <form class="form" id="pk-form" hidden>
      <div id="pk-chosen"></div>
      <div id="pk-prev" class="small muted num"></div>
      <div class="grid3">
        <label>Подходы<input class="input" name="n" inputmode="numeric" value="3" required></label>
        <label>Повторения<input class="input" name="reps" inputmode="numeric"></label>
        <label>Вес, кг<input class="input" name="w" inputmode="decimal"></label>
      </div>
      <div class="row gap">
        <button type="button" class="btn ghost" id="pk-back">Назад</button>
        <span class="grow"></span>
        <button class="btn primary" type="submit">Добавить в тренировку</button>
      </div>
    </form>`);
  const el = m.el;
  const drawList = () => {
    const items = filterExercises(activeExercises(), q, '');
    $('#pk-list', el).innerHTML = items.length ? items.map(e => exerciseCardHtml(e, 'pick-item')).join('')
      : `<div class="empty">${activeExercises().length ? 'Ничего не найдено' : 'Библиотека пуста — создайте первое упражнение'}</div>`;
  };
  drawList();
  $('#pk-search', el).oninput = e => { q = e.target.value; drawList(); };
  $('#pk-new', el).onclick = () => openExerciseForm(null, ex => { choose(ex.id); });
  $('#pk-list', el).onclick = e => { const c = e.target.closest('.ex-card'); if (c) choose(c.dataset.id); };
  $('#pk-back', el).onclick = () => { $('#pk-form', el).hidden = true; $('#pk-pick', el).hidden = false; };

  async function choose(id) {
    chosen = exById(id);
    if (!chosen) return;
    $('#pk-pick', el).hidden = true;
    const f = $('#pk-form', el);
    f.hidden = false;
    $('#pk-chosen', el).innerHTML = exerciseCardHtml(chosen);
    $('#pk-prev', el).textContent = '';
    const prev = (await loadPrevious([id], w.date))[id];
    if (chosen?.id !== id) return;
    if (prev) {
      state.prev[id] = prev;
      $('#pk-prev', el).textContent = `Прошлый раз, ${shortDate(prev.date)}: ${setsSummary(prev.sets)}`;
      const done = prev.sets.filter(s => s.done);
      f.n.value = done.length || prev.sets.length || 3;
      const top = done.reduce((a, s) => (s.actual_weight ?? -1) > (a?.actual_weight ?? -1) ? s : a, null);
      if (top) { f.reps.value = top.actual_reps ?? ''; f.w.value = fmtW(top.actual_weight); }
    }
  }

  $('#pk-form', el).onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target;
    const n = Math.min(20, Math.max(1, Math.round(num(f.n.value) || 1)));
    const reps = num(f.reps.value), wt = num(f.w.value);
    if ([reps, wt].some(x => x != null && Number.isNaN(x))) return toast('Повторения и вес должны быть числами', true);
    const pos = w.workout_exercises.reduce((mx, x) => Math.max(mx, x.position), -1) + 1;
    const { data: we, error } = await sb.from('workout_exercises')
      .insert({ workout_id: w.id, exercise_id: chosen.id, position: pos }).select().single();
    if (error) return fail(error);
    const rows = Array.from({ length: n }, (_, i) => ({
      workout_exercise_id: we.id, set_number: i + 1,
      planned_reps: reps == null ? null : Math.round(reps), planned_weight: wt,
    }));
    const { data: sets, error: e2 } = await sb.from('sets').insert(rows).select();
    if (e2) return fail(e2);
    we.sets = sets.sort((a, b) => a.set_number - b.set_number);
    w.workout_exercises.push(we);
    m.close();
    drawWorkout();
  };
}

function openCopyWorkout() {
  const w = state.w;
  const m = openModal(`
    <div class="sheet-head"><h2>Повторить тренировку</h2><button class="icon-btn" data-close aria-label="Закрыть">✕</button></div>
    <form class="form" id="cp-form">
      <label>Новая дата<input class="input" type="date" name="date" required value="${addDays(w.date, 7)}"></label>
      <label>Название<input class="input" name="title" value="${esc(w.title)}"></label>
      <p class="small muted" style="margin:0">Упражнения и подходы скопируются. Если подход был выполнен, его фактический вес и повторения станут новым планом.</p>
      <button class="btn primary block" type="submit">Создать копию</button>
    </form>`);
  $('#cp-form', m.el).onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const btn = $('button[type=submit]', ev.target); btn.disabled = true;
    try {
      const { data: nw, error } = await sb.from('workouts')
        .insert({ date: fd.get('date'), title: fd.get('title').trim() || null, notes: null }).select().single();
      if (error) throw error;
      const src = w.workout_exercises;
      if (src.length) {
        const { data: wes, error: e2 } = await sb.from('workout_exercises')
          .insert(src.map((we, i) => ({ workout_id: nw.id, exercise_id: we.exercise_id, position: i, notes: we.notes })))
          .select('id, position');
        if (e2) throw e2;
        const idByPos = Object.fromEntries(wes.map(x => [x.position, x.id]));
        const sets = src.flatMap((we, i) => we.sets.map(s => ({
          workout_exercise_id: idByPos[i],
          set_number: s.set_number,
          planned_reps: s.done && s.actual_reps != null ? s.actual_reps : s.planned_reps,
          planned_weight: s.done && s.actual_weight != null ? s.actual_weight : s.planned_weight,
        })));
        if (sets.length) {
          const { error: e3 } = await sb.from('sets').insert(sets);
          if (e3) throw e3;
        }
      }
      m.close();
      toast(`Скопировано на ${shortDate(nw.date)}`);
      goToWorkout(nw);
    } catch (err) { fail(err); btn.disabled = false; }
  };
}

// =====================================================================
// ПРОГРЕСС
// =====================================================================
function renderProgress() {
  setHeader('Прогресс');
  const v = $('#view');
  const list = [...state.exercises].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  if (!list.length) {
    v.innerHTML = `<div class="empty"><strong>Здесь появится прогресс</strong>Сначала добавьте упражнения и отмечайте выполненные подходы в тренировках.</div>`;
    return;
  }
  v.innerHTML = `
    <select class="input" id="pr-ex" aria-label="Упражнение">
      <option value="">Выберите упражнение</option>
      ${list.map(e => `<option value="${e.id}" ${e.id === state.progressExId ? 'selected' : ''}>${esc(e.name)}${e.archived ? ' (скрыто)' : ''}</option>`).join('')}
    </select>
    <div id="pr-body"></div>`;
  $('#pr-ex').onchange = e => { state.progressExId = e.target.value || null; state.metric = null; loadProgress(); };
  loadProgress();
}

async function loadProgress() {
  const body = $('#pr-body');
  if (state.chart) { state.chart.destroy(); state.chart = null; }
  const id = state.progressExId;
  if (!id) { body.innerHTML = `<div class="empty">Выберите упражнение, чтобы увидеть динамику веса, объёма и рекордов.</div>`; return; }
  body.innerHTML = '<div class="loading">Загрузка…</div>';
  const { data, error } = await sb.from('workout_exercises')
    .select('id, workouts!inner(id, date, title), sets(set_number, actual_reps, actual_weight, done)')
    .eq('exercise_id', id);
  if (error) return fail(error);
  if (state.progressExId !== id || state.tab !== 'progress') return;

  // группируем по дате
  const byDate = {};
  for (const r of data) {
    const sets = r.sets.filter(s => s.done && s.actual_reps != null).sort((a, b) => a.set_number - b.set_number);
    if (!sets.length) continue;
    const d = r.workouts.date;
    (byDate[d] ||= { date: d, workoutId: r.workouts.id, sets: [] }).sets.push(...sets);
  }
  const sessions = Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
  if (!sessions.length) {
    body.innerHTML = `<div class="empty"><strong>Пока нет данных</strong>Отмечайте подходы галочкой во время тренировки — результаты появятся здесь.</div>`;
    return;
  }
  for (const s of sessions) {
    const ws = s.sets.map(x => x.actual_weight).filter(x => x != null).map(Number);
    s.maxW = ws.length ? Math.max(...ws) : null;
    s.volume = s.sets.reduce((a, x) => a + x.actual_reps * (Number(x.actual_weight) || 0), 0);
    s.reps = s.sets.reduce((a, x) => a + x.actual_reps, 0);
    const e1 = s.sets.filter(x => x.actual_weight != null && x.actual_reps > 0)
      .map(x => Number(x.actual_weight) * (1 + x.actual_reps / 30));
    s.e1rm = e1.length ? Math.max(...e1) : null;
  }
  const hasWeight = sessions.some(s => s.maxW != null);
  const best = (k) => sessions.reduce((a, s) => (s[k] ?? -1) > (a?.[k] ?? -1) ? s : a, null);
  const METRICS = hasWeight
    ? { maxW: 'Макс. вес, кг', e1rm: 'Расчётный 1ПМ, кг', volume: 'Объём, кг', reps: 'Повторения' }
    : { reps: 'Повторения за тренировку' };
  if (!state.metric || !METRICS[state.metric]) state.metric = Object.keys(METRICS)[0];

  const bw = best('maxW'), be = best('e1rm'), bv = best('volume'), br = best('reps');
  const r1 = x => Math.round(x * 10) / 10;
  body.innerHTML = `
    <div class="metrics">
      ${hasWeight ? `
        <div class="metric"><div class="v">${fmtW(bw.maxW)}</div><div class="l">рекорд веса, кг</div></div>
        <div class="metric"><div class="v">${r1(be.e1rm)}</div><div class="l">расчётный 1ПМ</div></div>
        <div class="metric"><div class="v">${sessions.length}</div><div class="l">тренировок</div></div>`
      : `
        <div class="metric"><div class="v">${br.reps}</div><div class="l">рекорд повторений</div></div>
        <div class="metric"><div class="v">${sessions.length}</div><div class="l">тренировок</div></div>
        <div class="metric"><div class="v">${shortDate(sessions[sessions.length - 1].date)}</div><div class="l">последняя</div></div>`}
    </div>
    <div class="card">
      <div class="chips" id="pr-metrics" style="padding-top:0">
        ${Object.entries(METRICS).map(([k, l]) => `<button class="chip ${k === state.metric ? 'active' : ''}" data-m="${k}">${l}</button>`).join('')}
      </div>
      <div class="chart-box"><canvas id="pr-chart" aria-label="График прогресса"></canvas></div>
      ${state.metric === 'e1rm' ? `<p class="small muted" style="margin:10px 0 0">Оценка по формуле Эпли: вес × (1 + повторения / 30). Точнее всего для 1–10 повторений.</p>` : ''}
    </div>
    <h2 class="section-title">История</h2>
    <div class="hist">
      ${[...sessions].reverse().map(s => `<button class="hist-row w-item" data-w="${s.workoutId}" data-date="${s.date}" style="display:block">
        <div class="d">${esc(fmtDate(s.date))}</div>
        <div class="s">${esc(s.sets.map(setStr).join(', '))}${hasWeight ? `, объём ${Math.round(s.volume)} кг` : ''}</div>
      </button>`).join('')}
    </div>`;

  $$('#pr-metrics .chip').forEach(c => c.onclick = () => { state.metric = c.dataset.m; loadProgress(); });
  $('.hist').onclick = e => {
    const r = e.target.closest('[data-w]');
    if (r) goToWorkout({ id: r.dataset.w, date: r.dataset.date });
  };

  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent').trim();
  const muted = css.getPropertyValue('--muted').trim();
  const line = css.getPropertyValue('--line').trim();
  const pts = sessions.filter(s => s[state.metric] != null);
  state.chart = new Chart($('#pr-chart'), {
    type: 'line',
    data: {
      labels: pts.map(s => shortDate(s.date)),
      datasets: [{
        label: METRICS[state.metric],
        data: pts.map(s => r1(s[state.metric])),
        borderColor: accent, backgroundColor: accent, borderWidth: 3,
        pointRadius: pts.length > 30 ? 0 : 4, pointHoverRadius: 6, tension: 0.25,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: muted, maxRotation: 0, autoSkip: true, maxTicksLimit: 6 }, grid: { display: false } },
        y: { ticks: { color: muted }, grid: { color: line }, beginAtZero: state.metric === 'volume' || state.metric === 'reps' },
      },
    },
  });
}

boot();
</script>
</body>
